<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Iniciar sesión — MAQUINA</title>
<meta name="description" content="Accede a tu cuenta MAQUINA.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:title" content="Iniciar sesión — MAQUINA">
<meta property="og:description" content="Accede a tu cuenta MAQUINA.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://maquina-super.github.io/TIENDA-MAQUINA/login.html">
<meta property="og:image" content="https://maquina-super.github.io/TIENDA-MAQUINA/img/portada.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="css/estilos.css?v=4">
<link rel="stylesheet" href="css/maquina-ui.css?v=8">
<style>
  .yd-login-topright{
    display:flex; align-items:center; gap:16px;
    font-family:'Space Mono',monospace; color:#c9c9c5;
    font-size:clamp(9px,1.05vw,12px); letter-spacing:.16em; text-transform:uppercase;
    line-height:1.6; text-align:right;
  }
  .yd-login-topright .divider{ width:1px; height:26px; background:rgba(242,242,240,.25); }
  .yd-login-topright .bolt{ color:var(--acento); font-size:1.3em; line-height:0; text-shadow:0 0 14px var(--acento-glow); }

  .yd-login-features{
    display:flex; align-items:center; gap:16px; margin-top:14px;
  }
  .yd-login-deco{
    display:flex; align-items:center; gap:10px; margin-top:20px;
  }
  .yd-login-deco .solid{ width:34px; height:2px; background:var(--acento); box-shadow:0 0 8px var(--acento-glow); }
  .yd-login-deco .dashes{
    display:flex; align-items:center; gap:4px;
  }
  .yd-login-deco .dashes span{
    display:block; width:5px; height:2px; background:rgba(242,242,240,.35);
    transform:skewX(-30deg);
  }
  .yd-login-feature{
    display:flex; align-items:center; gap:8px;
    font-family:'Space Mono',monospace; color:#dcdcd8;
    font-size:clamp(9.5px,1vw,11.5px); letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  }
  .yd-login-feature svg{ width:18px; height:18px; color:var(--acento); flex:none; }
  .yd-login-feature img{ width:16px; height:auto; flex:none; filter:drop-shadow(0 0 6px var(--acento-glow)); }
  .yd-login-feature .divider{ width:1px; height:16px; background:rgba(242,242,240,.2); }

  .yd-login-tag{
    display:flex; align-items:center; gap:14px;
    margin-top:14px; text-align:center;
    font-family:'Space Mono',monospace; color:#9a9a96;
    font-size:clamp(9px,1vw,11px); letter-spacing:.22em; text-transform:uppercase;
  }
  .yd-login-tag .line{ width:34px; height:1px; background:rgba(242,242,240,.3); }

  .yd-login-btn.outline{
    background:rgba(5,8,5,.45); color:var(--acento);
    border:1.5px solid var(--acento); backdrop-filter:blur(2px);
    box-shadow:0 0 0 1px rgba(138,240,78,.25), 0 0 40px rgba(138,240,78,.28);
  }
  .yd-login-btn.outline:hover{ background:rgba(138,240,78,.12); }

  .yd-login-footer{
    position:relative; z-index:3; flex:0 0 auto;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 clamp(20px,4.4vw,56px) clamp(18px,3vw,28px);
  }
  .yd-login-footer-stripes{ position:relative; width:90px; height:38px; overflow:hidden; }
  .yd-login-footer-stripes span{
    position:absolute; bottom:-6px; left:0; height:56px; width:12px; border-radius:1px;
    background:var(--acento); transform:skewX(-24deg);
  }
  .yd-login-footer-stripes span:nth-child(1){ left:0px; opacity:.25; }
  .yd-login-footer-stripes span:nth-child(2){ left:18px; opacity:.45; }
  .yd-login-footer-stripes span:nth-child(3){ left:36px; opacity:.7; }
  .yd-login-footer-stripes span:nth-child(4){ left:54px; opacity:1; }
  .yd-login-footer-right{
    text-align:right; font-family:'Space Mono',monospace; color:#c9c9c5;
    font-size:clamp(9px,1.05vw,12px); letter-spacing:.14em; text-transform:uppercase; line-height:1.6;
  }
  @media (max-width:1024px){
    .yd-login-topright{ display:none; }
    .yd-login-features{ justify-content:center; flex-wrap:wrap; }
    .yd-login-footer{ padding-bottom:14px; }
  }
  @media (max-height:460px) and (max-width:1024px){
    .yd-login-deco{ display:none; }
    .yd-login-features{ margin-top:4px; gap:10px; }
    .yd-login-feature{ font-size:9px; }
    .yd-login-tag{ margin-top:6px; font-size:8px; }
    .yd-login-footer{ padding-bottom:8px; }
    .yd-login-footer-stripes{ transform:scale(.7); transform-origin:left bottom; }
  }
</style>
</head>
<body class="yd-login-body">

<div class="yd-login">

  <div class="yd-login-media">
    <img class="yd-login-media-bg" src="img/login-model-v2.jpg" alt="" loading="eager" aria-hidden="true">
    <img class="yd-login-media-fg" src="img/login-model-v2.jpg" alt="" loading="eager">
  </div>
  <div class="yd-login-overlay"></div>

  <div class="yd-login-top">
    <a href="index.html" class="yd-login-logo">
      <img src="img/logo-maquina-gym-hq.png" alt="MAQUINA" class="yd-login-logo-img">
    </a>
    <div class="yd-login-topright">
      <span>ROPA URBANA<br>DE EDICIÓN LIMITADA</span>
      <span class="divider"></span>
      <span class="bolt">⚡</span>
    </div>
  </div>

  <div class="yd-login-content">
    <span class="yd-login-eyebrow">Disciplina</span>
    <h1 class="yd-login-title">La disciplina<br>no es negociable.<br>Y tu ropa <span class="accent">tampoco.</span></h1>
    <p class="yd-login-desc">Tu mentalidad te lleva lejos, pero tu estilo también te representa.</p>
    <div class="yd-login-deco">
      <span class="solid"></span>
      <span class="dashes"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
    </div>
    <div class="yd-login-features">
      <div class="yd-login-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
        <span>Disciplina</span>
      </div>
      <span class="divider"></span>
      <div class="yd-login-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 6 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-6-3.8-9s1.3-6.3 3.8-9Z"/></svg>
        <span>Estilo</span>
      </div>
      <span class="divider"></span>
      <div class="yd-login-feature">
        <img src="img/logo-crown.png" alt="">
        <span>Maquina</span>
      </div>
    </div>
  </div>

  <div class="yd-login-cta" style="flex-direction:column;gap:14px;">
    <a href="index.html" class="yd-login-btn outline">
      Ingresar
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <div class="yd-login-tag"><span class="line"></span>Entra. Entrena. Supera.<span class="line"></span></div>
  </div>

  <div class="yd-login-footer">
    <div class="yd-login-footer-stripes"><span></span><span></span><span></span><span></span></div>
    <div class="yd-login-footer-right">
      <div>MAQUINA GYM</div>
      <div>EST. 2026</div>
    </div>
  </div>

</div>


</body>
</html>
