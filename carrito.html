/* ---------- helpers ---------- */
function fmtDinero(n) {

function animarClase(el, clase) {
  if (!el) return;
  el.classList.remove(clase);
  void el.offsetWidth;            // reinicia la animación
  el.classList.add(clase);
}
const reducirMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Muestra un valor en pesos y, si cambió, lo "cuenta" hasta el nuevo número. */
function setDinero(el, valor) {
  if (!el) return;
  const desde = typeof el._valor === 'number' ? el._valor : valor;
  el._valor = valor;
  cancelAnimationFrame(el._raf);
  if (desde === valor || reducirMovimiento) { el.textContent = fmtDinero(valor); return; }
  const t0 = performance.now(), dur = 380;
  (function paso(t) {
    const p = Math.min(1, (t - t0) / dur);
    const suave = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtDinero(Math.round(desde + (valor - desde) * suave));
    if (p < 1) el._raf = requestAnimationFrame(paso);
  })(t0);
  animarClase(el, 'tick');
}

/** Nombre aproximado del color a partir de su HEX (el catálogo solo guarda el código). */
const PALETA_COLORES = [
  ['Negro', '#151512'], ['Gris oscuro', '#3a3a36'], ['Gris', '#83807a'], ['Blanco', '#faf9f5'],
  ['Hueso', '#eceae3'], ['Crema', '#f5ecd6'], ['Beige', '#d8c3a5'], ['Café', '#6b4423'],
  ['Verde menta', '#dfe8da'], ['Verde', '#2f6b4a'], ['Verde oscuro', '#1b4332'], ['Lila', '#e7d9ee'],
  ['Morado', '#6a3d9a'], ['Rosado', '#f3e0da'], ['Fucsia', '#d63384'], ['Rojo', '#c0392b'],
  ['Naranja', '#e67e22'], ['Amarillo', '#ffd600'], ['Azul claro', '#9ec5e8'], ['Azul', '#2d4a8a'],
];
function nombreColor(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return '';
  const rgb = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r, g, b] = rgb(m[1]);
  let mejor = '', dMin = Infinity;
  PALETA_COLORES.forEach(([nombre, h]) => {
    const [r2, g2, b2] = rgb(h.slice(1));
    const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2;
    if (d < dMin) { dMin = d; mejor = nombre; }
  });
  return mejor;
}

/* Agrupa items idénticos (mismo id + color + talla) en uno solo con cantidad */
function agruparCarrito(carrito) {
  const grupos = [];
  carrito.forEach(item => {
    const existente = grupos.find(g => g.id == item.id && g.color === item.color && g.talla === item.talla);
    if (existente) { existente.cantidad++; existente.subtotal += Number(item.precio); }
    else grupos.push({ ...item, cantidad: 1, subtotal: Number(item.precio) });
  });
  return grupos;
}

  est.avisosPrecio.forEach((av, k) => {
    const sube = av.ahora > av.antes;
    h += `<div class="cart-notice ${sube ? 'is-warn' : 'is-good'}" role="status">${svgInfo()}<span>El precio de <b>${esc(av.nombre)}</b>${av.talla ? ` (talla ${esc(av.talla)})` : ''} ${sube ? 'subió' : 'bajó'}: antes ${fmtDinero(av.antes)}, ahora <b>${fmtDinero(av.ahora)}</b>.</span><button type="button" class="notice-x" data-notice="cerrar" data-k="${k}" aria-label="Cerrar aviso">×</button></div>`;
  });
  if (a.verificado && a.problemas > 0) {
    const hayQuitar = a.grupos.some(g => g.info.estado === 'no_disponible' || g.info.estado === 'agotado');
    h += `<div class="cart-notice is-error" role="alert">${svgAlerta()}<span>${a.problemas === 1 ? 'Hay 1 producto que' : `Hay ${a.problemas} productos que`} necesita${a.problemas === 1 ? '' : 'n'} tu atención antes de pagar.</span>${hayQuitar ? '<button type="button" class="notice-act" data-notice="quitar-malos">Quitar no disponibles</button>' : ''}</div>`;
  }
  return h;
}

  const listEl = document.getElementById('cartList');
  const selectMunicipio = document.getElementById('municipioEnvio');
  const envioValorEl = document.getElementById('envioValor');
  const totalValorEl = document.getElementById('totalValor');
  let envioZona = 0;     // costo del envío según el municipio elegido
  let envioActual = 0;   // costo que de verdad se cobra (0 si aplica envío gratis)
  let pasoActual = 1, metodoPago = null, enviandoPedido = false;

  /** ¿Qué impide pagar ahora mismo? ('' = nada) */
  function motivoBloqueo(a) {
    if (a.estadoValidacion === 'pendiente') return 'cargando';
    if (a.verificado && a.problemas > 0) return 'problemas';
    if (a.unidadesValidas === 0) return 'vacio';
    if (a.unidades > MAX_UNIDADES_PEDIDO) return 'limite';
    return '';
  }

  function recalcularResumen() {
    const a = CarritoCore.analizar();
    const subtotal = a.subtotal;
    const gratis = ENVIO_GRATIS_DESDE > 0 && subtotal >= ENVIO_GRATIS_DESDE;
    envioActual = gratis ? 0 : envioZona;

    setDinero(document.getElementById('subtotalValor'), subtotal);
    const conDesc = a.descuentos > 0;
    const filaLista = document.getElementById('listaFila'), filaDesc = document.getElementById('descFila');
    if (filaLista) { filaLista.hidden = !conDesc; setDinero(document.getElementById('listaValor'), a.lista); }
    if (filaDesc) {
      filaDesc.hidden = !conDesc;
      const dv = document.getElementById('descValor');
      if (dv) dv.textContent = '−' + fmtDinero(a.descuentos);
    }
    const ahorro = document.getElementById('ahorroTxt');
    if (ahorro) { ahorro.hidden = !conDesc; if (conDesc) ahorro.textContent = `Estás ahorrando ${fmtDinero(a.descuentos)} en este pedido`; }

    const filaEnvio = document.getElementById('envioFila');
    if (filaEnvio) filaEnvio.classList.toggle('is-free', gratis);
    if (gratis) envioValorEl.textContent = '¡Gratis!';
    else envioValorEl.textContent = envioZona ? fmtDinero(envioZona) : (selectMunicipio && selectMunicipio.value ? '¡Gratis!' : 'Se calcula al elegir tu municipio');
    setDinero(totalValorEl, subtotal + envioActual);

    const banner = document.getElementById('shipBanner');
    if (banner) {
      const falta = Math.max(0, ENVIO_GRATIS_DESDE - subtotal);
      banner.classList.toggle('is-done', gratis);
      document.getElementById('shipBannerTxt').textContent = gratis
        ? '¡Envío gratis!'
        : `Te faltan ${fmtDinero(falta)} para el envío gratis`;
      document.getElementById('shipBar').style.width = Math.min(100, Math.round(subtotal / ENVIO_GRATIS_DESDE * 100)) + '%';
    }

    if (typeof renderRevision === 'function') { if (pasoActual === 3) renderRevision(); else pintarTotalesRevision(a); }

    // si ya eligió Nequi, el valor a transferir tiene que seguir al total
    const chipActivo = wrap.querySelector('.metodo-card.active');
    const nequiValor = document.getElementById('nequiValorTxt');
    if (chipActivo && chipActivo.dataset.metodo === 'nequi' && nequiValor) nequiValor.textContent = totalValorEl.textContent;

    // botón "Finalizar": bloqueado (sin deshabilitarlo) mientras haya algo por resolver
    const motivo = motivoBloqueo(a);
    const btn = document.getElementById('btnFinalizar'), msg = document.getElementById('cartBloqueoMsg');
    if (btn) {
      btn.classList.toggle('is-blocked', !!motivo && motivo !== 'cargando');
      btn.classList.toggle('is-loading', motivo === 'cargando');
      btn.setAttribute('aria-disabled', motivo ? 'true' : 'false');
    }
    if (msg) {
      msg.hidden = !motivo;
      msg.textContent = motivo === 'cargando' ? 'Verificando disponibilidad…'
        : motivo === 'problemas' ? 'Resuelve los avisos de tus productos para poder pagar.'
        : motivo === 'limite' ? `Un pedido admite hasta ${MAX_UNIDADES_PEDIDO} prendas. Quita algunas o divide tu compra en dos pedidos.`
        : motivo === 'vacio' ? 'No hay productos disponibles para comprar.' : '';
    }
    if (typeof actualizarBarraMovil === 'function') actualizarBarraMovil(a, subtotal + envioActual, motivo);
  }

  function actualizarContadores() {
    const n = totalCarritoCount();
    const hdr = document.getElementById('cartCount');
    if (hdr) { hdr.textContent = n; animarClase(hdr, 'bump'); }
    const c = document.getElementById('cartListCount');
    const w = document.getElementById('cartListWord');
    if (c) c.textContent = n;
    if (w) w.textContent = n === 1 ? 'producto' : 'productos';
  }

  /** Repinta lista, avisos y resumen SIN tocar el formulario (no se pierde lo escrito). */
  function refrescar() {
    const a = CarritoCore.analizar();
    if (!a.grupos.length) { pintarCarrito(); return; }
    if (!document.getElementById('cartList')) { pintarCarrito(); return; }
    listEl.classList.remove('is-first');
    listEl.innerHTML = a.grupos.map((g, n) => htmlFila(g, n)).join('');
    document.getElementById('cartNotices').innerHTML = htmlAvisos(a);
    recalcularResumen();
    actualizarContadores();
  }
  window.__carrito = { refrescar, recalcularResumen };

  /* ---------- filas: cambiar cantidad / quitar (sin repintar todo) ---------- */
  function quitarFilaAnimada(fila) {
    if (fila.dataset.saliendo) return;
    fila.dataset.saliendo = '1';
    fila.style.maxHeight = fila.offsetHeight + 'px';
    void fila.offsetWidth;
    fila.classList.add('is-leaving');
    setTimeout(() => {
      fila.remove();
      if (!listEl.querySelector('.cart-item')) pintarCarrito();   // ya no queda nada: estado vacío
    }, reducirMovimiento ? 0 : 340);
  }

  /** Rehace por dentro UNA fila con los datos actuales (conserva el foco del teclado). */
  function refrescarFila(fila) {
    const { id, color, talla } = fila.dataset;
    const a = CarritoCore.analizar();
    const g = a.grupos.find(x => x.id == id && x.color === color && x.talla === talla);
    if (!g) { quitarFilaAnimada(fila); return; }
    const activo = document.activeElement;
    const claseFoco = fila.contains(activo) ? ['qty-plus', 'qty-minus', 'btn-eliminar'].find(c => activo.classList.contains(c)) : null;
    const lineaPrev = fila.querySelector('.cart-item-line');
    const prev = lineaPrev && typeof lineaPrev._valor === 'number' ? lineaPrev._valor : null;
    fila.classList.toggle('is-unavailable', g.info.estado === 'no_disponible' || g.info.estado === 'agotado');
    fila.classList.toggle('is-warning', g.info.estado === 'parcial');
    fila.innerHTML = htmlFilaInterior(g);
    const linea = fila.querySelector('.cart-item-line');
    if (linea) { if (prev !== null) linea._valor = prev; setDinero(linea, g.subtotal); }
    animarClase(fila.querySelector('.qty-value'), 'bump');
    animarClase(fila, 'flash');
    if (claseFoco) (fila.querySelector('.' + claseFoco) || fila.querySelector('.qty-minus'))?.focus({ preventScroll: true });
  }

  function despuesDeCambio(fila) {
    refrescarFila(fila);
    document.getElementById('cartNotices').innerHTML = htmlAvisos(CarritoCore.analizar());
    recalcularResumen();
    actualizarContadores();
  }

  function deshacerA(instantanea) {
    return () => {
      _guardar(LS_KEYS.carrito, instantanea);
      if (document.getElementById('cartList')) window.__carrito.refrescar(); else pintarCarrito();
      actualizarContadoresGlobal();
    };
  }

  listEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.qty-plus, .qty-minus, .btn-eliminar, [data-act]');
    if (!btn) return;
    e.preventDefault();
    const fila = btn.closest('.cart-item');
    if (!fila || fila.dataset.saliendo) return;
    const { id, color, talla } = fila.dataset;
    const antes = CarritoCore.leer();
    const cantidadAntes = antes.filter(it => it.id == id && it.color === color && it.talla === talla).length;
    const nombreProd = (antes.find(it => it.id == id) || {}).nombre || 'producto';

    if (btn.dataset.act === 'ajustar') {
      CarritoCore.ajustarAlStock(id, color, talla, Number(btn.dataset.n) || 0);
      despuesDeCambio(fila);
      return;
    }
    if (btn.dataset.act === 'quitar' || btn.classList.contains('btn-eliminar') || (btn.classList.contains('qty-minus') && cantidadAntes <= 1)) {
      eliminarGrupo(id, color, talla);
      despuesDeCambio(fila);
      mostrarSnack(`Quitaste «${nombreProd}»`, 'Deshacer', deshacerA(antes));
      return;
    }
    if (btn.classList.contains('qty-plus')) {
      if (btn.classList.contains('is-loading')) return;
      if (CarritoCore.estado.validacion === 'pendiente') {       // necesitamos el catálogo para revisar el stock
        btn.classList.add('is-loading');
        await catalogoListo;
        btn.classList.remove('is-loading');
      }
      const producto = buscarProducto(id);
      if (!producto) { showToastCarrito('No pudimos revisar el stock de este producto ahora mismo. Intenta de nuevo.'); return; }
      if (!CarritoCore.vendible(producto)) { showToastCarrito(`${producto.nombre} ya no está disponible.`); refrescar(); return; }
      const mas = CarritoCore.cuantasMasSePuede(producto, color, talla, CarritoCore.leer());
      if (mas <= 0) {
        const tope = CarritoCore.topeVariante(producto, color, talla);
        showToastCarrito(tope <= 0 ? `${producto.nombre} está agotado en esa combinación.` : `Ya tienes todas las unidades disponibles (${tope}) de ${producto.nombre} en ese color y talla.`);
        animarClase(fila, 'shake');
        return;
      }
      agregarAlCarrito(producto, color, talla);
    } else if (btn.classList.contains('qty-minus')) {
      quitarUnidad(id, color, talla);
    }
    despuesDeCambio(fila);
  });

  /* ---------- avisos sobre la lista ---------- */
  document.getElementById('cartNotices').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-notice]');
    if (!b) return;
    const acc = b.dataset.notice;
    if (acc === 'cerrar') { CarritoCore.estado.avisosPrecio.splice(Number(b.dataset.k), 1); refrescar(); }
    else if (acc === 'reintentar') { b.classList.add('is-busy'); await revalidar(); }
    else if (acc === 'quitar-malos') {
      const antes = CarritoCore.leer();
      CarritoCore.quitarNoDisponibles();
      refrescar();
      actualizarContadoresGlobal();
      mostrarSnack('Quitamos los productos no disponibles', 'Deshacer', deshacerA(antes));
    }
  });

  const btnLimpiar = document.getElementById('btnLimpiar');
  if (btnLimpiar) {
    btnLimpiar.addEventListener('click', (e) => {
      e.preventDefault();
      const antes = CarritoCore.leer();
      limpiarCarrito();
      listEl.querySelectorAll('.cart-item').forEach((fila, i) => setTimeout(() => quitarFilaAnimada(fila), reducirMovimiento ? 0 : i * 70));
      recalcularResumen();
      actualizarContadores();
      mostrarSnack('Vaciaste el carrito', 'Deshacer', deshacerA(antes));
    });
  }

  /* =====================================================================
     CHECKOUT POR PASOS: 1 Tus datos → 2 Entrega → 3 Resumen y pago → 4 Confirmación
     · Cada paso es un panel del MISMO formulario: al retroceder, los campos
       siguen ahí (no se borra nada). Además se guarda un borrador en
       sessionStorage por si la página se recarga.
     · Una sola puerta de entrada (accionPrincipal) y un solo candado
       (enviandoPedido): no hay clics ni pedidos duplicados.
     ===================================================================== */
  const $ = (id) => document.getElementById(id);
  const formPago = $('form-pago');
  const paneles = [...wrap.querySelectorAll('.ck-panel')];
  const PASOS = {
    1: { eyebrow: 'Paso 1 de 4', titulo: 'Tus datos', sub: 'Los usamos solo para confirmar y entregar tu pedido.', cta: 'Continuar a entrega' },
    2: { eyebrow: 'Paso 2 de 4', titulo: 'Dirección y entrega', sub: 'Dinos dónde recibirás tu pedido.', cta: 'Revisar mi pedido' },
    3: { eyebrow: 'Paso 3 de 4', titulo: 'Resumen y pago', sub: 'Revisa todo y elige cómo pagar.', cta: 'Confirmar pedido' },
  };
  const textoAccion = (n) => (n === 3 ? 'Confirmar pedido' : 'Continuar');

  /* ---- avisos cuando algo impide seguir ---- */
  function avisarBloqueo(motivo) {
    if (motivo === 'cargando') showToastCarrito('Estamos verificando la disponibilidad. Un momento…');
    else if (motivo === 'problemas') { showToastCarrito('Resuelve los avisos de tu carrito antes de pagar.'); $('cartNotices').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'center' }); }
    else if (motivo === 'limite') showToastCarrito(`Un pedido admite hasta ${MAX_UNIDADES_PEDIDO} prendas. Quita algunas o divide tu compra en dos pedidos.`);
    else showToastCarrito('Tu carrito no tiene productos disponibles para comprar.');
  }
  function mostrarAlerta(texto) {
    const el = $('ckAlert');
    if (!el) return;
    el.textContent = texto || '';
    el.hidden = !texto;
  }

  /* ---- stepper de arriba (clic en un paso ya hecho = volver ahí) ---- */
  const stepperSteps = wrap.querySelectorAll('.stepper-step');
  const stepperLines = wrap.querySelectorAll('.stepper-line');
  function activarStepper(n) {
    stepperSteps.forEach(s => {
      const num = Number(s.dataset.stepper);
      const circle = s.querySelector('.stepper-circle');
      s.classList.remove('is-active', 'is-done');
      s.removeAttribute('aria-current');
      const hecho = num < n;
      if (hecho) { s.classList.add('is-done'); circle.textContent = '✓'; }
      else { circle.textContent = num; if (num === n) { s.classList.add('is-active'); s.setAttribute('aria-current', 'step'); } }
      s.toggleAttribute('data-volver', hecho && num <= 3);
      s.setAttribute('tabindex', hecho && num <= 3 ? '0' : '-1');
      s.setAttribute('role', hecho && num <= 3 ? 'button' : 'presentation');
    });
    stepperLines.forEach(l => l.classList.toggle('is-done', Number(l.dataset.line) < n));
  }
  stepperSteps.forEach(s => {
    const ir = () => { const num = Number(s.dataset.stepper); if (s.hasAttribute('data-volver') && !enviandoPedido && num < pasoActual) irAPaso(num); };
    s.addEventListener('click', ir);
    s.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ir(); } });
  });

  /* ---- navegación entre pasos ---- */
  function irAPaso(n, opciones) {
    const op = opciones || {};
    pasoActual = n;
    paneles.forEach(p => {
      const activo = Number(p.dataset.step) === n;
      p.hidden = !activo;
      p.classList.toggle('is-active', activo);
    });
    const info = PASOS[n];
    $('ckEyebrow').textContent = info.eyebrow;
    $('ckTitulo').textContent = info.titulo;
    $('ckSub').textContent = info.sub;
    $('ckAtras').hidden = n === 1;
    $('ckSiguienteTxt').textContent = info.cta;
    const bf = $('btnFinalizarTxt'); if (bf) bf.textContent = textoAccion(n);
    const mb = document.querySelector('#mbBtn span'); if (mb) mb.textContent = textoAccion(n);
    activarStepper(n);
    const acciones = $('resumenAcciones');
    if (acciones) acciones.classList.toggle('visible', n === 3);
    mostrarAlerta('');
    if (n === 3) renderRevision();
    guardarBorrador();
    // el botón "Atrás" del navegador también retrocede de paso
    if (!op.desdeHistorial) {
      try { history[op.reemplazar ? 'replaceState' : 'pushState']({ ckPaso: n }, '', location.href); } catch (e) { /* sin historial */ }
    }
    if (op.desplazar !== false) $('ckBox').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'start' });
    if (op.enfocar !== false) {
      setTimeout(() => {
        const panel = paneles.find(p => Number(p.dataset.step) === n);
        const primero = n === 3 ? $('ckTitulo') : panel.querySelector('input:not([type=checkbox]):not([type=hidden]), select:not([style*="display: none"])');
        if (primero) primero.focus({ preventScroll: true });
      }, 80);
    }
  }
  if (window.__ckPop) window.removeEventListener('popstate', window.__ckPop);
  window.__ckPop = (e) => {
    if (enviandoPedido || pedidoConfirmado || !$('ckBox')) return;
    const n = (e.state && e.state.ckPaso) || 1;
    if (n !== pasoActual) irAPaso(Math.min(n, pasoActual), { desdeHistorial: true, enfocar: false });
  };
  window.addEventListener('popstate', window.__ckPop);

  $('ckAtras').addEventListener('click', () => { if (!enviandoPedido && pasoActual > 1) irAPaso(pasoActual - 1); });
  wrap.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { if (!enviandoPedido) irAPaso(Number(b.dataset.goto)); }));
  const editarCarrito = $('ckEditarCarrito');
  if (editarCarrito) editarCarrito.addEventListener('click', (e) => { e.preventDefault(); $('cartList').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'start' }); });

  /* ---- punto único de entrada: botón del formulario, botón del resumen y barra del celular ---- */
  async function accionPrincipal() {
    if (enviandoPedido || pedidoConfirmado) return;
    if (pasoActual === 1) { if (validarPaso1()) irAPaso(2); return; }
    if (pasoActual === 2) { if (validarPaso2()) irAPaso(3); return; }
    await confirmarPedido();
  }
  formPago.addEventListener('submit', (e) => { e.preventDefault(); accionPrincipal(); });
  const btnFinalizar = $('btnFinalizar');
  if (btnFinalizar) btnFinalizar.addEventListener('click', (e) => { e.preventDefault(); accionPrincipal(); });

  /* ---- campos: errores se limpian al corregir, teléfono con formato, correo con sugerencia ---- */
  wrap.querySelectorAll('.ck-panel input, .ck-panel select, .ck-panel textarea').forEach(el => {
    el.addEventListener('input', () => { if (!wrap.querySelector('.ck-panel.is-active .campo-error:not(#' + el.id + ')')) mostrarAlerta(''); if (el.classList.contains('campo-error')) { el.classList.remove('campo-error'); el.removeAttribute('aria-invalid'); const err = $('err' + el.id.charAt(0).toUpperCase() + el.id.slice(1)); if (err) { err.textContent = ''; err.classList.remove('mostrar'); } } });
    if (el.tagName === 'INPUT' && el.type !== 'checkbox') {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id !== 'municipioInput') { e.preventDefault(); accionPrincipal(); } });
    }
  });
  const inTel = $('telefonoCliente');
  inTel.addEventListener('input', () => {
    let d = inTel.value.replace(/\D/g, '');
    if (d.length > 10 && d.startsWith('57')) d = d.slice(2);
    d = d.slice(0, 10);
    const f = d.replace(/^(\d{3})(\d{1,3})?(\d{1,4})?$/, (m, a, b, c) => [a, b, c].filter(Boolean).join(' '));
    if (inTel.value !== f) inTel.value = f;
  });
  const DOMINIOS_TYPO = { 'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gamil.com': 'gmail.com', 'gmail.con': 'gmail.com', 'gmail.co': 'gmail.com', 'hotmial.com': 'hotmail.com', 'hotmal.com': 'hotmail.com', 'hotmail.con': 'hotmail.com', 'outlok.com': 'outlook.com', 'outlook.con': 'outlook.com', 'yahooo.com': 'yahoo.com', 'yaho.com': 'yahoo.com' };
  const inEmail = $('emailCliente'), sugEmail = $('ckEmailSug');
  function revisarCorreoTypo() {
    const v = inEmail.value.trim();
    const dom = v.split('@')[1] ? v.split('@')[1].toLowerCase() : '';
    const bueno = DOMINIOS_TYPO[dom];
    if (bueno) { sugEmail.textContent = `¿Quisiste decir ${v.split('@')[0]}@${bueno}?`; sugEmail.dataset.valor = `${v.split('@')[0]}@${bueno}`; sugEmail.hidden = false; }
    else sugEmail.hidden = true;
  }
  inEmail.addEventListener('blur', revisarCorreoTypo);
  inEmail.addEventListener('input', () => { sugEmail.hidden = true; });
  sugEmail.addEventListener('click', () => { inEmail.value = sugEmail.dataset.valor; sugEmail.hidden = true; limpiarErrorCampo('emailCliente', 'errEmailCliente'); guardarBorrador(); });

  /* ---- envío dinámico según la zona elegida ---- */
  if (selectMunicipio) {
    selectMunicipio.addEventListener('change', () => {
      const opt = selectMunicipio.selectedOptions[0];
      envioZona = opt && opt.value ? Number(opt.dataset.costo || 0) : 0;
      recalcularResumen();
    });
  }
  recalcularResumen();

  /* ---- departamento + ciudad ----
     Antioquia: se busca entre sus 125 municipios (sin importar tildes) y la zona/costo sale solo.
     Otro departamento: se escribe la ciudad y se aplica la tarifa "Otra ciudad de Colombia". */
  const quitarTildes = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const munInput = $('municipioInput'), munSug = $('municipioSugerencias');
  const selDepto = $('departamentoEnvio'), chkRural = $('ckRural');
  const listaMun = () => municipiosDe(selDepto.value).map(m => ({ ...m, clave: quitarTildes(m.nombre) }));   // municipios del departamento elegido (con la tarifa del panel si la hay)
  let municipioElegidoNombre = '';
  let zonaElegida = '';
  const esAntioquia = () => selDepto.value === 'Antioquia';

  function zonaActual() {
    if (!municipioElegidoNombre) return '';
    const m = listaMun().find(x => x.nombre === municipioElegidoNombre);
    if (esAntioquia() && chkRural.checked) return 'vereda';
    if (m && m.personalizado) return m.id;          // tarifa propia de la ciudad (panel → Envíos)
    if (!esAntioquia()) return 'otra_ciudad';
    return m ? m.zona : '';
  }
  function actualizarZona() {
    zonaElegida = zonaActual();
    if (selectMunicipio) {
      const mc = /^m\d{5}$/.test(zonaElegida) ? listaMun().find(x => x.id === zonaElegida) : null;
      if (mc) {   // la tarifa por ciudad no está entre las zonas de siempre: se agrega su opción
        let o = selectMunicipio.querySelector(`option[value="${zonaElegida}"]`);
        if (!o) { o = document.createElement('option'); o.value = zonaElegida; selectMunicipio.appendChild(o); }
        o.dataset.costo = mc.costo; o.textContent = `${mc.nombre} — ${fmtDinero(mc.costo)}`;
      }
      selectMunicipio.value = zonaElegida; selectMunicipio.dispatchEvent(new Event('change'));
    }
    const rural = esAntioquia() && chkRural.checked;
    $('ckRuralWrap').hidden = !(esAntioquia() && municipioElegidoNombre);
    $('ckVeredaWrap').hidden = !rural;
    $('ckBarrioWrap').hidden = rural;
    const info = $('ckZonaInfo');
    if (zonaElegida && envioZona >= 0 && selectMunicipio.value) {
      info.hidden = false;
      info.innerHTML = `${svgCamion()}<span>Envío a <b>${esc(municipioElegidoNombre)}</b>: <b>${envioZona ? fmtDinero(envioZona) : '¡Gratis!'}</b></span>`;
    } else info.hidden = true;
  }
  function elegirMunicipio(m) {
    municipioElegidoNombre = m.nombre;
    munInput.value = m.nombre;
    limpiarErrorCampo('municipioInput', 'errMunicipioEnvio');
    cerrarSugerencias();
    actualizarZona();
    guardarBorrador();
  }
  function cerrarSugerencias() { munSug.classList.remove('open'); munInput.setAttribute('aria-expanded', 'false'); }
  let visibles = [], activo = -1;
  function pintarSugerencias() {
    const todos = listaMun();
    const eligioLista = todos.some(m => m.nombre === municipioElegidoNombre);
    const q = quitarTildes(eligioLista && munInput.value === municipioElegidoNombre ? '' : munInput.value);
    let lista = q ? todos.filter(m => m.clave.includes(q)) : todos.slice();
    if (q) lista.sort((a, b) => (b.clave.startsWith(q) - a.clave.startsWith(q)) || a.nombre.localeCompare(b.nombre, 'es'));
    visibles = lista; activo = lista.length && q ? 0 : -1;
    munSug.innerHTML = lista.length
      ? lista.map((m, i) => `<button type="button" role="option" class="municipio-sug${i === activo ? ' is-active' : ''}" data-i="${i}"><span>${esc(m.nombre)}</span><span class="municipio-sug-costo">${m.gratis ? 'Gratis' : fmtDinero(m.costo)}</span></button>`).join('')
      : `<div class="municipio-sug-vacio">No encontramos "${esc(munInput.value)}" en ${esc(selDepto.value)}. ${esAntioquia() ? 'Si vives en otro departamento, cámbialo arriba.' : 'Puedes escribir tu ciudad tal cual y se aplica la tarifa estándar.'}</div>`;
    munSug.classList.add('open'); munInput.setAttribute('aria-expanded', 'true');
  }
  munSug.addEventListener('mousedown', (e) => e.preventDefault());   // no robar el foco al input
  munSug.addEventListener('click', (e) => { const b = e.target.closest('.municipio-sug'); if (b) elegirMunicipio(visibles[Number(b.dataset.i)]); });
  munInput.addEventListener('focus', () => { pintarSugerencias(); });
  munInput.addEventListener('input', () => {
    const v = munInput.value.trim();
    if (esAntioquia()) {
      if (munInput.value !== municipioElegidoNombre) municipioElegidoNombre = '';
    } else {   // fuera de Antioquia: si coincide con una ciudad de la lista se usa su tarifa; si no, se acepta lo escrito
      const ex = listaMun().find(m => m.clave === quitarTildes(v));
      municipioElegidoNombre = ex ? ex.nombre : (v.length >= 3 ? v : '');
    }
    actualizarZona();
    pintarSugerencias();
  });
  munInput.addEventListener('keydown', (e) => {
    if (!munSug.classList.contains('open')) return;
    const marcar = () => munSug.querySelectorAll('.municipio-sug').forEach((b, i) => { b.classList.toggle('is-active', i === activo); if (i === activo) b.scrollIntoView({ block: 'nearest' }); });
    if (e.key === 'ArrowDown') { e.preventDefault(); activo = Math.min(visibles.length - 1, activo + 1); marcar(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activo = Math.max(0, activo - 1); marcar(); }
    else if (e.key === 'Escape') { cerrarSugerencias(); }
    else if (e.key === 'Enter') {
      const exacto = listaMun().find(m => m.clave === quitarTildes(munInput.value));
      const m = exacto || visibles[Math.max(activo, 0)];
      e.preventDefault();
      if (m && munInput.value.trim()) elegirMunicipio(m);
    }
  });
  munInput.addEventListener('blur', () => {
    setTimeout(() => {
      const exacto = listaMun().find(m => m.clave === quitarTildes(munInput.value));
      if (exacto && (!municipioElegidoNombre || munInput.value !== exacto.nombre)) elegirMunicipio(exacto);
      cerrarSugerencias();
    }, 120);
  });
  if (window.__ckDocClick) document.removeEventListener('click', window.__ckDocClick);
  window.__ckDocClick = (e) => { if (!e.target.closest('#municipioAutocomplete')) cerrarSugerencias(); };
  document.addEventListener('click', window.__ckDocClick);
  selDepto.addEventListener('change', () => {
    municipioElegidoNombre = ''; munInput.value = ''; chkRural.checked = false;
    munInput.placeholder = esAntioquia() ? 'Ej: Medellín' : 'Escribe tu ciudad o municipio';
    limpiarErrorCampo('municipioInput', 'errMunicipioEnvio');
    actualizarZona();
    guardarBorrador();
  });
  chkRural.addEventListener('change', () => { actualizarZona(); });
  window.__actualizarZonaEnvio = () => { if (municipioElegidoNombre) actualizarZona(); };

  /* ---- mapa para ubicar la dirección (Leaflet + OpenStreetMap, sin API key) ---- */
  const btnMostrarMapa = $('btnMostrarMapa');
  const mapaWrap = $('mapaWrap');
  const btnMiUbicacion = $('btnMiUbicacion');
  const mapaHint = $('mapaHint');
  let mapaLeaflet = null, marcadorLeaflet = null;

  function inicializarMapa(lat, lng) {
    if (typeof L === 'undefined') { mapaHint.textContent = 'No pudimos cargar el mapa ahora. Escribe tu dirección a mano, por favor.'; return; }
    if (mapaLeaflet) { mapaLeaflet.invalidateSize(); return; }
    mapaLeaflet = L.map('mapaEnvio').setView([lat, lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(mapaLeaflet);
    marcadorLeaflet = L.marker([lat, lng], { draggable: true }).addTo(mapaLeaflet);

    async function ubicarDesdePunto(latlng) {
      marcadorLeaflet.setLatLng(latlng);
      mapaHint.textContent = 'Buscando la dirección de ese punto...';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`);
        const data = await res.json();
        const direccionTexto = data && data.display_name ? data.display_name.split(',').slice(0, 3).join(',') : '';
        if (direccionTexto) {
          $('direccionCliente').value = direccionTexto;
          limpiarErrorCampo('direccionCliente', 'errDireccionCliente');
          mapaHint.textContent = '📍 Dirección ubicada: ' + direccionTexto + '. Revísala y corrígela si hace falta.';
        } else {
          mapaHint.textContent = 'Ubicamos el punto en el mapa, pero escribe la dirección manualmente por si acaso.';
        }
      } catch (err) {
        mapaHint.textContent = 'No pudimos leer la dirección automáticamente, pero el punto quedó marcado en el mapa.';
      }
    }
    mapaLeaflet.on('click', (e) => ubicarDesdePunto(e.latlng));
    marcadorLeaflet.on('dragend', () => ubicarDesdePunto(marcadorLeaflet.getLatLng()));
  }
  if (btnMostrarMapa) {
    btnMostrarMapa.addEventListener('click', () => {
      const yaAbierto = mapaWrap.classList.toggle('open');
      btnMostrarMapa.textContent = yaAbierto ? '📍 Ocultar el mapa' : '📍 ¿No sabes bien tu dirección? Ubícala en el mapa';
      if (yaAbierto) setTimeout(() => inicializarMapa(6.2442, -75.5812), 150); // centro por defecto: Medellín
    });
  }
  if (btnMiUbicacion) {
    btnMiUbicacion.addEventListener('click', () => {
      if (!navigator.geolocation) { showToastCarrito('Tu navegador no permite compartir ubicación.'); return; }
      mapaHint.textContent = 'Buscando tu ubicación...';
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        if (!mapaLeaflet) inicializarMapa(latitude, longitude);
        if (!mapaLeaflet) return;
        mapaLeaflet.setView([latitude, longitude], 16);
        marcadorLeaflet.setLatLng([latitude, longitude]);
        marcadorLeaflet.fire('dragend');
      }, () => {
        showToastCarrito('No pudimos acceder a tu ubicación. Actívala en el navegador o marca el punto en el mapa.');
      });
    });
  }

  /* ---- método de pago ---- */
  const chips = wrap.querySelectorAll('.metodo-card');
  const camposTarjeta = $('camposTarjeta');
  const camposNequi = $('camposNequi');
  const camposPse = $('camposPse');
  function elegirMetodo(chip) {
    chips.forEach(c => { c.classList.remove('active'); c.setAttribute('aria-checked', 'false'); });
    chip.classList.add('active'); chip.setAttribute('aria-checked', 'true');
    metodoPago = chip.dataset.metodo;
    if (camposTarjeta) camposTarjeta.classList.toggle('open', metodoPago === 'tarjeta');
    if (camposNequi) camposNequi.classList.toggle('open', metodoPago === 'nequi');
    if (camposPse) camposPse.classList.toggle('open', metodoPago === 'pse');
    if (metodoPago === 'nequi' && $('nequiValorTxt')) $('nequiValorTxt').textContent = totalValorEl.textContent;
    const em = $('errMetodoPago'); if (em) { em.textContent = ''; em.classList.remove('mostrar'); }
    guardarBorrador();
  }
  chips.forEach(chip => chip.addEventListener('click', () => elegirMetodo(chip)));
  // Teclado (patrón "radiogroup"): flechas, Inicio y Fin mueven y eligen el método visible siguiente/anterior
  chips.forEach(chip => chip.addEventListener('keydown', (e) => {
    const teclas = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft', 'Home', 'End'];
    if (!teclas.includes(e.key)) return;
    const visibles = Array.from(chips).filter(c => !c.hidden && c.offsetParent !== null);
    if (visibles.length < 2) return;
    e.preventDefault();
    let i = visibles.indexOf(chip);
    if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = visibles.length - 1;
    else i = (i + (e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1) + visibles.length) % visibles.length;
    visibles[i].focus();
    elegirMetodo(visibles[i]);
  }));
  wrap.querySelectorAll('.nequi-copiar').forEach(btn => {
    btn.addEventListener('click', () => {
      const texto = $(btn.dataset.copiar).textContent.trim();
      navigator.clipboard?.writeText(texto);
      showToastCarrito('Copiado: ' + texto);
    });
  });

  /* ---- tarjeta animada (solo existe si PAGO_TARJETA_ACTIVO) ---- */
  const inNumero = $('tarjetaNumero'), inTitular = $('tarjetaTitular'), inVenc = $('tarjetaVencimiento'), inCvv = $('tarjetaCvv');
  if (inNumero) {
    const tarjetaVisual = $('tarjetaVisual');
    inNumero.addEventListener('input', () => {
      const v = inNumero.value.replace(/\D/g, '').slice(0, 16);
      inNumero.value = v.replace(/(.{4})/g, '$1 ').trim();
      $('tarjetaNumeroVista').textContent = v ? v.padEnd(16, '•').replace(/(.{4})/g, '$1 ').trim() : '•••• •••• •••• ••••';
    });
    inTitular.addEventListener('input', () => { $('tarjetaTitularVista').textContent = inTitular.value.trim().toUpperCase() || 'TU NOMBRE AQUÍ'; });
    inVenc.addEventListener('input', () => {
      let v = inVenc.value.replace(/\D/g, '').slice(0, 4);
      if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
      inVenc.value = v; $('tarjetaVencVista').textContent = v || 'MM/AA';
    });
    inCvv.addEventListener('input', () => { inCvv.value = inCvv.value.replace(/\D/g, '').slice(0, 4); $('tarjetaCvvVista').textContent = inCvv.value.padEnd(3, '•'); });
    inCvv.addEventListener('focus', () => tarjetaVisual.classList.add('flip'));
    inCvv.addEventListener('blur', () => tarjetaVisual.classList.remove('flip'));
  }

  /* ---- paso 3: revisión del pedido ---- */
  function lineasEntrega() {
    const v = (id) => ($(id).value || '').trim();
    const rural = esAntioquia() && chkRural.checked;
    const l1 = [v('direccionCliente'), v('edificioCliente')].filter(Boolean).join(' · ');
    const l2 = rural ? (v('veredaCliente') ? 'Vereda ' + v('veredaCliente') : '') : v('barrioCliente');
    const l3 = [municipioElegidoNombre, selDepto.value].filter(Boolean).join(', ');
    return { l1, l2, l3, ref: v('referenciaCliente') };
  }
  function renderRevision() {
    const a = CarritoCore.analizar();
    $('ckRevItems').innerHTML = a.grupos.map(g => {
      const c = nombreColor(g.color);
      const foto = miniaturaProducto(g);
      return `<div class="ck-item"><div class="ck-item-img">${foto}${g.cantidad > 1 ? `<span class="ck-item-q">×${g.cantidad}</span>` : ''}</div>
        <div class="ck-item-info"><b>${esc(g.nombre)}</b><small>${c ? esc(c) + ' · ' : ''}Talla ${esc(g.talla || '—')}${g.cantidad > 1 ? ` · ${fmtDinero(g.precio)} c/u` : ''}</small></div>
        <div class="ck-item-precio">${fmtDinero(g.subtotal)}</div></div>`;
    }).join('');
    const tel = ($('telefonoCliente').value || '').trim();
    $('ckRevContacto').innerHTML = `<b>${esc($('nombreCliente').value.trim())}</b><span>${esc($('emailCliente').value.trim())}</span><span>+57 ${esc(tel)}</span>`;
    const e = lineasEntrega();
    $('ckRevEntrega').innerHTML = `<b>${esc(e.l1)}</b>${e.l2 ? `<span>${esc(e.l2)}</span>` : ''}<span>${esc(e.l3)}</span>${e.ref ? `<span class="ck-ref">“${esc(e.ref)}”</span>` : ''}`;
    pintarTotalesRevision(a);
  }
  function pintarTotalesRevision(a) {
    a = a || CarritoCore.analizar();
    const set = (id, t) => { const el = $(id); if (el) el.textContent = t; };
    const conDesc = a.descuentos > 0;
    if ($('ckLista')) { $('ckLista').hidden = !conDesc; set('ckListaV', fmtDinero(a.lista)); }
    if ($('ckDesc')) { $('ckDesc').hidden = !conDesc; set('ckDescV', '−' + fmtDinero(a.descuentos)); }
    set('ckSubV', fmtDinero(a.subtotal));
    set('ckEnvioV', !selectMunicipio || !selectMunicipio.value ? 'Elige tu ciudad' : (envioActual ? fmtDinero(envioActual) : '¡Gratis!'));
    set('ckTotalV', fmtDinero(a.subtotal + envioActual));
  }
  window.__ckRevision = () => { if (pasoActual === 3) renderRevision(); };

  /* ---- borrador del formulario (se conserva si se recarga la página) ---- */
  const CAMPOS_BORRADOR = ['nombreCliente', 'emailCliente', 'telefonoCliente', 'direccionCliente', 'barrioCliente', 'veredaCliente', 'edificioCliente', 'referenciaCliente', 'pseBanco', 'psePersona'];
  let _tBorrador = null;
  function guardarBorradorYa() {
    if (pedidoConfirmado) return;
    clearTimeout(_tBorrador);
    try {
      const d = { depto: selDepto.value, municipio: municipioElegidoNombre, rural: chkRural.checked, metodo: metodoPago, paso: pasoActual };
      CAMPOS_BORRADOR.forEach(id => { const el = $(id); if (el) d[id] = el.value; });
      sessionStorage.setItem(CLAVE_BORRADOR, JSON.stringify(d));
    } catch (e) { /* sin sessionStorage: no pasa nada */ }
  }
  function guardarBorrador() {
    if (pedidoConfirmado) return;
    clearTimeout(_tBorrador);
    _tBorrador = setTimeout(guardarBorradorYa, 250);
  }
  function restaurarBorrador() {
    let d = null;
    try { d = JSON.parse(sessionStorage.getItem(CLAVE_BORRADOR) || 'null'); } catch (e) { d = null; }
    if (!d) return 1;
    CAMPOS_BORRADOR.forEach(id => { const el = $(id); if (el && typeof d[id] === 'string') el.value = d[id]; });
    if (d.depto && [...selDepto.options].some(o => o.value === d.depto)) selDepto.value = d.depto;
    munInput.placeholder = esAntioquia() ? 'Ej: Medellín' : 'Escribe tu ciudad o municipio';
    if (d.municipio) { municipioElegidoNombre = d.municipio; munInput.value = d.municipio; }
    chkRural.checked = !!d.rural && esAntioquia();
    actualizarZona();
    const chip = d.metodo && wrap.querySelector(`.metodo-card[data-metodo="${d.metodo}"]`);
    if (chip) elegirMetodo(chip);
    // vuelve al paso en el que iba, solo si los pasos anteriores siguen completos
    const p = Number(d.paso) || 1;
    if (p >= 2 && paso1Completo() && (p === 2 || paso2Completo())) return Math.min(p, 3);
    return 1;
  }
  formPago.addEventListener('input', guardarBorrador);
  formPago.addEventListener('change', guardarBorrador);

  /* ---- pago: validación del paso 3 ---- */
  function validarPago() {
    let ok = true, primero = null;
    const falla = (id, idErr, msg) => { marcarErrorCampo(id, idErr, msg); ok = false; if (!primero) primero = $(id); };
    if (!metodoPago) {
      const em = $('errMetodoPago'); em.textContent = 'Elige cómo quieres pagar.'; em.classList.add('mostrar'); ok = false;
      primero = primero || wrap.querySelector('.metodo-card');
    }
    if (metodoPago === 'pse' && !$('pseBanco').value) falla('pseBanco', 'errPseBanco', 'Selecciona tu banco para pagar con PSE.');
    if (metodoPago === 'nequi' && !$('nequiConfirmado').checked) { const en = $('errNequi'); en.textContent = 'Confirma que ya hiciste la transferencia por Nequi.'; en.classList.add('mostrar'); ok = false; primero = primero || $('nequiConfirmado'); }
    if (metodoPago === 'tarjeta' && inNumero) {
      const num = inNumero.value.replace(/\D/g, '');
      if (num.length < 16 || !inTitular.value.trim() || inVenc.value.length < 5 || inCvv.value.length < 3) { showToastCarrito('Revisa los datos de tu tarjeta.'); ok = false; primero = primero || inNumero; }
    }
    if (!$('aceptaTerminos').checked) falla('aceptaTerminos', 'errAceptaTerminos', 'Para continuar, acepta los términos y el tratamiento de datos.');
    if (!ok) { mostrarAlerta('Revisa lo marcado en rojo para poder confirmar.'); if (primero) { primero.scrollIntoView({ block: 'center', behavior: reducirMovimiento ? 'auto' : 'smooth' }); primero.focus({ preventScroll: true }); } }
    else mostrarAlerta('');
    return ok;
  }

  /* ---- candado de envío + overlay de estados ---- */
  function ponerOcupado(si) {
    enviandoPedido = si;
    $('ckBox').classList.toggle('is-busy', si);
    formPago.setAttribute('aria-busy', String(si));
    ['ckSiguiente', 'ckAtras', 'btnFinalizar', 'mbBtn'].forEach(id => { const b = $(id); if (b) { b.classList.toggle('is-loading', si && id !== 'ckAtras'); b.setAttribute('aria-disabled', String(si)); if (id === 'ckSiguiente' || id === 'ckAtras') b.disabled = si; } });
  }
  const demora = (ms) => new Promise(r => setTimeout(r, ms));

  async function confirmarPedido() {
    // 1) ¿el carrito está listo para pagar?
    const a0 = CarritoCore.analizar();
    const motivo = motivoBloqueo(a0);
    if (motivo) { avisarBloqueo(motivo); return; }
    // 2) todos los datos, otra vez (por si saltó pasos con el stepper o el borrador)
    if (!validarPaso1()) { irAPaso(1); return; }
    if (!validarPaso2()) { irAPaso(2); return; }
    if (!validarPago()) return;
    if (!navigator.onLine) {
      actualizarAvisoOffline();
      mostrarAlerta('No tienes conexión a internet. Conéctate e intenta de nuevo.');
      showToastCarrito('No tienes conexión a internet.');
      return;
    }

    ponerOcupado(true);                    // candado: desde aquí ningún clic cuenta
    abrirOverlay('procesando');
    try {
      // 3) datos viejos (>45 s): se vuelve a consultar el catálogo; si cambió el total, se avisa antes de cobrar
      if (Date.now() - CarritoCore.estado.fecha > 45000) {
        await revalidar();
        const a1 = CarritoCore.analizar();
        const m1 = motivoBloqueo(a1);
        if (m1) throw Object.assign(new Error('bloqueo'), { code: 'BLOQUEO_LOCAL', motivo: m1 });
        if (a1.subtotal !== a0.subtotal) throw Object.assign(new Error('Actualizamos los precios de tu carrito. Revisa el nuevo total y vuelve a confirmar.'), { code: 'PRECIO_CAMBIO' });
      }
      const e = lineasEntrega();
      const envio = {
        departamento: selDepto.value,
        municipio: municipioElegidoNombre,
        zona: zonaElegida,
        costo: envioActual,
        barrio: $('barrioCliente').value.trim(),
        vereda: $('veredaCliente').value.trim(),
        direccion: $('direccionCliente').value.trim(),
        edificio: $('edificioCliente').value.trim(),
        referencia: $('referenciaCliente').value.trim(),
      };
      const pse = metodoPago === 'pse' ? { banco: $('pseBanco').value, persona: $('psePersona').value } : null;
      const tarjetaFinal = metodoPago === 'tarjeta' && inNumero ? inNumero.value.replace(/\D/g, '').slice(-4) : null;
      const [pedido] = await Promise.all([
        crearPedido({
          nombre: $('nombreCliente').value, email: $('emailCliente').value, telefono: $('telefonoCliente').value,
          metodoPago, tarjetaFinal, pse, envio, aceptaTerminos: $('aceptaTerminos').checked, envioGratisDesde: ENVIO_GRATIS_DESDE,
        }),
        demora(700),                       // que el estado "procesando" no parpadee
      ]);
      if (!pedido) throw Object.assign(new Error('Tu carrito quedó vacío.'), { code: 'CARRITO_VACIO' });
      mostrarConfirmacion(pedido, metodoPago, e);
    } catch (err) {
      console.error('Error al confirmar el pedido:', err);
      ponerOcupado(false);                 // se libera el candado solo si NO se creó el pedido
      mostrarErrorPedido(err);
    }
  }

  /* ---- arranque ---- */
  const pasoInicial = restaurarBorrador();
  const chipInicial = wrap.querySelector('.metodo-card[data-metodo="contraentrega"]') || chips[0];
  if (chipInicial && !metodoPago) elegirMetodo(chipInicial);
  window.__ck = { irAPaso, confirmar: confirmarPedido, avisarBloqueo, flush: guardarBorradorYa };
  irAPaso(pasoInicial, { enfocar: false, desplazar: false, reemplazar: true });
}

/* ---------- validación real de campos del checkout ---------- */

/** Correo con forma válida: algo@algo.algo (sin espacios). */
function emailValido(valor) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor) && valor.length <= 120;
}
/** Teléfono colombiano razonable: 7 a 10 dígitos, dejando de lado
    espacios, guiones y el +57 si lo escriben. */
function telefonoValido(valor) {
  return !!normalizarTelefonoCO(valor);
}
/** Nombre real: al menos nombre y apellido, solo letras, espacios, punto, apóstrofe o guion. */
function nombreValido(valor) {
  const v = valor.trim().replace(/\s+/g, ' ');
  return v.length >= 3 && v.split(' ').length >= 2 && /^[\p{L}][\p{L}\s.'’-]*$/u.test(v);
}

/** Igual que validarPaso1/2, pero sin pintar nada en rojo — solo dicen si el
    paso ya quedó completo (se usa para restaurar el borrador). */
function paso1Completo() {
  const val = (id) => (document.getElementById(id)?.value || '').trim();
  return nombreValido(val('nombreCliente')) && emailValido(val('emailCliente')) && telefonoValido(val('telefonoCliente'));
}
function paso2Completo() {
  const val = (id) => (document.getElementById(id)?.value || '').trim();
  const zona = document.getElementById('municipioEnvio')?.value || '';
  const rural = zona === 'vereda' && document.getElementById('departamentoEnvio')?.value === 'Antioquia';
  return !!zona && val('direccionCliente').length >= 5 && (!rural || val('veredaCliente').length >= 2);
}

/** Pinta un input en rojo y muestra su mensaje de error debajo.
    idInput = id del <input>/<select>, idError = id del div de mensaje. */
function marcarErrorCampo(idInput, idError, mensaje) {
  const input = document.getElementById(idInput);
  const err = document.getElementById(idError);
  if (input) { input.classList.add('campo-error'); input.setAttribute('aria-invalid', 'true'); }
  if (err) { err.textContent = mensaje; err.classList.add('mostrar'); }
}
function limpiarErrorCampo(idInput, idError) {
  const input = document.getElementById(idInput);
  const err = document.getElementById(idError);
  if (input) { input.classList.remove('campo-error'); input.removeAttribute('aria-invalid'); }
  if (err) { err.textContent = ''; err.classList.remove('mostrar'); }
}
function _alertaPaso(texto) {
  const el = document.getElementById('ckAlert');
  if (el) { el.textContent = texto || ''; el.hidden = !texto; }
}
function _enfocarPrimerError(ids) {
  const el = ids.map(id => document.getElementById(id)).find(e => e && e.classList.contains('campo-error'));
  if (el) { el.scrollIntoView({ block: 'center', behavior: reducirMovimiento ? 'auto' : 'smooth' }); el.focus({ preventScroll: true }); }
}

/** Revisa nombre/correo/teléfono. Devuelve true si todo está bien;
    si algo falla, marca el campo en rojo, lleva el foco ahí y devuelve false. */
function validarPaso1() {
  let ok = true;
  const nombre = document.getElementById('nombreCliente').value.trim();
  const email = document.getElementById('emailCliente').value.trim();
  const telefono = document.getElementById('telefonoCliente').value.trim();

  if (!nombre) { marcarErrorCampo('nombreCliente', 'errNombreCliente', 'Escribe tu nombre completo.'); ok = false; }
  else if (!nombreValido(nombre)) { marcarErrorCampo('nombreCliente', 'errNombreCliente', 'Escribe tu nombre y apellido, solo con letras (ej: María Gómez).'); ok = false; }
  else limpiarErrorCampo('nombreCliente', 'errNombreCliente');

  if (!email) { marcarErrorCampo('emailCliente', 'errEmailCliente', 'Escribe tu correo electrónico.'); ok = false; }
  else if (!emailValido(email)) { marcarErrorCampo('emailCliente', 'errEmailCliente', 'Ese correo no se ve válido: revisa que tenga "@" y un dominio (ej: nombre@correo.com).'); ok = false; }
  else limpiarErrorCampo('emailCliente', 'errEmailCliente');

  if (!telefono) { marcarErrorCampo('telefonoCliente', 'errTelefonoCliente', 'Escribe tu celular o WhatsApp.'); ok = false; }
  else if (!telefonoValido(telefono)) { marcarErrorCampo('telefonoCliente', 'errTelefonoCliente', 'Ese número no se ve válido: debe tener 10 dígitos (ej: 300 123 4567).'); ok = false; }
  else limpiarErrorCampo('telefonoCliente', 'errTelefonoCliente');

  _alertaPaso(ok ? '' : 'Revisa los campos marcados en rojo para continuar.');
  if (!ok) _enfocarPrimerError(['nombreCliente', 'emailCliente', 'telefonoCliente']);
  return ok;
}

/** Revisa departamento, ciudad y dirección. Misma idea que validarPaso1. */
function validarPaso2() {
  let ok = true;
  const sel = document.getElementById('municipioEnvio');
  const depto = document.getElementById('departamentoEnvio').value;
  const direccion = document.getElementById('direccionCliente').value.trim();

  if (!sel.value) {
    marcarErrorCampo('municipioInput', 'errMunicipioEnvio', depto === 'Antioquia'
      ? 'Elige tu municipio de la lista: escribe las primeras letras y tócalo.'
      : 'Escribe tu ciudad o municipio (mínimo 3 letras).');

  } else limpiarErrorCampo('municipioInput', 'errMunicipioEnvio');

  if (!direccion) { marcarErrorCampo('direccionCliente', 'errDireccionCliente', 'Escribe la dirección de entrega.'); ok = false; }
  else if (direccion.length < 5) { marcarErrorCampo('direccionCliente', 'errDireccionCliente', 'Esa dirección se ve incompleta: agrega calle o carrera y número (ej: Calle 45 # 30-12).'); ok = false; }
  else limpiarErrorCampo('direccionCliente', 'errDireccionCliente');

  if (rural && document.getElementById('veredaCliente').value.trim().length < 2) { marcarErrorCampo('veredaCliente', 'errVeredaCliente', 'Escribe el nombre de tu vereda.'); ok = false; }
  else limpiarErrorCampo('veredaCliente', 'errVeredaCliente');

  _alertaPaso(ok ? '' : 'Revisa los campos marcados en rojo para continuar.');
  if (!ok) _enfocarPrimerError(['departamentoEnvio', 'municipioInput', 'direccionCliente', 'veredaCliente']);
  return ok;
}

const ICONO_ERROR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.8 19.5h18.4L12 3.5Z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>';
let _ovTimer = null;

function abrirOverlay(estado) {
  const ov = document.getElementById('ck-overlay');
  const card = ov.querySelector('.ck-ov-card');
  clearTimeout(_ovTimer);
  ov.dataset.estado = estado;
  ov.hidden = false;
  document.body.classList.add('ck-lock');
  document.getElementById('ckOvAcciones').hidden = true;
  if (estado === 'procesando') {
    document.getElementById('ckOvIcon').innerHTML = '<span class="ck-spin"></span>';

    document.getElementById('ckOvMsg').textContent = 'Estamos guardando tu pedido y reservando tus prendas. No cierres esta página.';
    document.getElementById('ckOvBarra').hidden = false;
    _ovTimer = setTimeout(() => {
      document.getElementById('ckOvMsg').textContent = 'Está tardando más de lo normal. No cierres ni recargues: aunque reintentes, tu pedido no se duplicará.';
    }, 9000);
  }
  card.focus({ preventScroll: true });
}
function cerrarOverlay() {
  const ov = document.getElementById('ck-overlay');
  if (!ov) return;
  clearTimeout(_ovTimer);
  ov.hidden = true;
  ov.dataset.estado = '';
  document.body.classList.remove('ck-lock');
}
function _mostrarErrorOverlay(titulo, msg, primario, secundario) {
  clearTimeout(_ovTimer);
  const ov = document.getElementById('ck-overlay');
  ov.dataset.estado = 'error';
  ov.hidden = false;
  document.body.classList.add('ck-lock');
  document.getElementById('ckOvIcon').innerHTML = ICONO_ERROR;
  document.getElementById('ckOvTitulo').textContent = titulo;
  document.getElementById('ckOvMsg').textContent = msg;
  document.getElementById('ckOvBarra').hidden = true;
  const bp = document.getElementById('ckOvPrimario'), bs = document.getElementById('ckOvSecundario');
  bp.textContent = primario.txt; bp.onclick = primario.fn;
  bs.hidden = !secundario;
  if (secundario) { bs.textContent = secundario.txt; bs.onclick = secundario.fn; }
  document.getElementById('ckOvAcciones').hidden = false;
  bp.focus({ preventScroll: true });
}
document.addEventListener('keydown', (e) => {
  const ov = document.getElementById('ck-overlay');
  if (!ov || ov.hidden) return;
  if (e.key === 'Escape' && ov.dataset.estado === 'error') { cerrarOverlay(); return; }
  if (e.key === 'Tab') {                       // el foco se queda dentro del aviso
    const bs = [...ov.querySelectorAll('button:not([hidden])')].filter(b => b.offsetParent);
    if (!bs.length) { e.preventDefault(); return; }
    const i = bs.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); bs[bs.length - 1].focus(); }
    else if (!e.shiftKey && i === bs.length - 1) { e.preventDefault(); bs[0].focus(); }
  }
});

function mostrarErrorPedido(err) {
  const code = err && err.code;
  const ck = window.__ck || {};
  const volver = { txt: 'Volver al formulario', fn: cerrarOverlay };
  const revisarCarrito = { txt: 'Revisar mi carrito', fn: async () => {
    cerrarOverlay();
    await revalidar();
    const n = document.getElementById('cartNotices'); if (n) n.scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'center' });
  } };
  const reintentar = { txt: 'Reintentar', fn: () => { cerrarOverlay(); if (ck.confirmar) ck.confirmar(); } };
  const sinRed = !navigator.onLine || ['unavailable', 'deadline-exceeded', 'cancelled'].includes(code) || /network|offline|failed to fetch/i.test(String(err && err.message));

  if (code === 'BLOQUEO_LOCAL') { cerrarOverlay(); if (ck.avisarBloqueo) ck.avisarBloqueo(err.motivo); return; }
  if (code === 'SIN_STOCK' || code === 'SIN_PRODUCTO') return _mostrarErrorOverlay('Un producto ya no está disponible', err.message, revisarCarrito, volver);
  if (code === 'LIMITE_UNIDADES') return _mostrarErrorOverlay('Demasiadas prendas en un pedido', err.message, revisarCarrito, volver);
  if (code === 'PRECIO_CAMBIO') return _mostrarErrorOverlay('Cambió un precio', err.message, revisarCarrito, volver);
  if (code === 'ENVIO_CAMBIO') {
    return _mostrarErrorOverlay('Cambió el costo de envío', err.message, { txt: 'Actualizar mi envío', fn: async () => {
      cerrarOverlay();
      if (ck.flush) ck.flush();
      await cargarConfigEnvio();
      pintarCarrito();
    } }, volver);
  }
  if (code === 'DATOS_INVALIDOS') {
    return _mostrarErrorOverlay('Revisa tus datos', err.message, { txt: 'Corregir mis datos', fn: () => {
      cerrarOverlay();
      if (ck.irAPaso) ck.irAPaso(paso1Completo() ? 2 : 1);
      setTimeout(() => { validarPaso1() && validarPaso2(); }, 150);
    } }, null);
  }
  if (code === 'CARRITO_VACIO') return _mostrarErrorOverlay('Tu carrito está vacío', 'Parece que tu carrito ya no tiene productos. Si ya habías confirmado el pedido, revisa tu correo.', { txt: 'Volver a la tienda', fn: () => { location.href = 'productos.html'; } }, null);
  if (code === 'permission-denied') {
    return _mostrarErrorOverlay('No pudimos validar tu pedido', 'El servidor no aceptó los datos del pedido: suele pasar cuando un precio o el costo de envío cambió. Actualizamos tu carrito; revisa el total y confirma otra vez.', revisarCarrito, volver);
  }
  if (sinRed) {
    return _mostrarErrorOverlay('Sin conexión con el servidor', 'No pudimos enviar tu pedido. Revisa tu internet y reintenta: si el pedido ya se había guardado, no se duplica ni se cobra dos veces.', reintentar, volver);
  }
  return _mostrarErrorOverlay('No pudimos registrar tu pedido', 'Hubo un problema con el servidor. Puedes reintentar: tu pedido no se duplicará. Si sigue fallando, escríbenos por WhatsApp.', reintentar, volver);
}

/** Miniatura del producto: su foto, o el icono de su categoría si no tiene foto. */
function miniaturaProducto(g) {
  if (g.foto) return `<img src="${esc(g.foto)}" alt="" loading="lazy" decoding="async">`;
  let icono = g.icono;
  if (!icono && typeof buscarProducto === 'function') { const pr = buscarProducto(g.id); icono = pr && pr.icono; }
  return icono && typeof iconoProducto === 'function' ? iconoProducto(icono, g.color || '#dfe8da') : '';
}

function fmtTelCO(t) {
  const d = String(t || '').replace(/\D/g, '');

function htmlStepper(n) {
  const labels = ['Tus datos', 'Entrega', 'Resumen', 'Confirmación'];
  let h = '<div class="checkout-stepper" id="checkoutStepper" aria-label="Progreso de la compra">';
  labels.forEach((t, i) => {
    const k = i + 1;
    if (k > 1) h += `<div class="stepper-line${k - 1 < n ? ' is-done' : ''}" data-line="${k - 1}"></div>`;
    h += `<div class="stepper-step${k < n ? ' is-done' : (k === n ? ' is-active' : '')}" data-stepper="${k}"><div class="stepper-circle">${k < n ? '✓' : k}</div><div class="stepper-label">${t}</div></div>`;
  });
  return h + '</div>';
}

/** Vuelve a leer el catálogo de Firestore y corrige precios / stock del carrito. */
let _revalidando = null;
function revalidar() {
  if (_revalidando) return _revalidando;
  _revalidando = (async () => {
    try {
      await cargarCatalogo();
      CarritoCore.reconciliar(typeof catalogoDesdeNube === 'function' && catalogoDesdeNube());
    } catch (e) {
      CarritoCore.reconciliar(false);
    } finally {
      _revalidando = null;
    }
    if (window.__carrito) window.__carrito.refrescar();
    actualizarContadoresGlobal();
  })();
  return _revalidando;
}
/* primera validación: en cuanto llega el catálogo */
catalogoListo.then(() => {
  CarritoCore.reconciliar(typeof catalogoDesdeNube === 'function' && catalogoDesdeNube());

  if (chips) chips.innerHTML = htmlChipsCategorias();
});
/* al volver a la pestaña después de un rato, se revisa de nuevo (alguien pudo comprar lo último) */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && CarritoCore.estado.validacion !== 'pendiente' && Date.now() - CarritoCore.estado.fecha > 60000) revalidar();
});

/* ---------- mensaje inferior con "Deshacer" ---------- */
function mostrarSnack(texto, accion, alAccionar) {
  let el = document.getElementById('cartSnack');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cartSnack'; el.className = 'cart-snack';
    el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.innerHTML = `<span></span><button type="button"></button>`;
  el.firstChild.textContent = texto;
  const b = el.querySelector('button');
  b.textContent = accion || '';
  b.hidden = !accion;
  b.onclick = () => { el.classList.remove('show'); if (alAccionar) alAccionar(); };
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 6000);
}

/* ---------- barra fija en celular: total + botón, mientras el resumen no se ve ---------- */
let _barra = null, _barraObs = null, _barraEstado = { oculta: false, resumenVisible: false, enCampo: false };
function actualizarBarraMovil(a, total, motivo) {
  if (!_barra) {
    _barra = document.createElement('div');
    _barra.className = 'cart-mobilebar'; _barra.id = 'cartMobileBar'; _barra.hidden = true;
    _barra.innerHTML = `<div class="mb-total"><small>Total</small><b id="mbTotal">$0</b></div><button type="button" class="mb-btn" id="mbBtn">${svgCandado()}<span>Finalizar compra</span><i class="btn-spinner" aria-hidden="true"></i></button>`;
    document.body.appendChild(_barra);
    _barra.querySelector('#mbBtn').addEventListener('click', () => { const b = document.getElementById('btnFinalizar'); if (b) b.click(); });
    // si el teclado está abierto (escribiendo en el formulario), la barra estorba
    document.addEventListener('focusin', (e) => { _barraEstado.enCampo = !!e.target.closest('input, textarea, select'); pintarEstadoBarra(); });
    document.addEventListener('focusout', () => { _barraEstado.enCampo = false; pintarEstadoBarra(); });
  }
  if (!a) { _barraEstado.vacia = true; pintarEstadoBarra(); return; }
  _barraEstado.vacia = false;
  const mt = _barra.querySelector('#mbTotal');
  if (mt) mt.textContent = fmtDinero(total);
  _barra.classList.toggle('is-blocked', !!motivo && motivo !== 'cargando');
  _barra.classList.toggle('is-loading', motivo === 'cargando');
  // observar el bloque de acciones del resumen: si ya se ve, la barra sobra
  const acciones = document.getElementById('resumenAcciones');
  if (acciones && 'IntersectionObserver' in window && _barraObs && _barraObs._el !== acciones) { _barraObs.disconnect(); _barraObs = null; }
  if (acciones && 'IntersectionObserver' in window && !_barraObs) {
    _barraObs = new IntersectionObserver((en) => { _barraEstado.resumenVisible = en[0].isIntersecting; pintarEstadoBarra(); }, { threshold: 0.2 });
    _barraObs._el = acciones; _barraObs.observe(acciones);
  }
  pintarEstadoBarra();
}
function pintarEstadoBarra() {
  if (!_barra) return;
  const oculta = _barraEstado.vacia || _barraEstado.resumenVisible || _barraEstado.enCampo;
  _barra.hidden = !!_barraEstado.vacia;
  _barra.classList.toggle('is-hidden', !!oculta);
  document.body.classList.toggle('has-mobilebar', !_barraEstado.vacia);
}

pintarCarrito();
_primeraPintura = false;
</script>
