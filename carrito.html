<script>
renderHeader('carrito');
renderFooter();

/* =====================================================   AJUSTES DEL CARRITO
   ENVIO_GRATIS_DESDE: subtotal (en pesos) desde el cual el envío
   es gratis. 0 = desactivado (se cobra siempre el envío de la
   zona). Ejemplo: 250000 -> envío gratis desde $250.000.
   ============================================================ */
const ENVIO_GRATIS_DESDE = 0;

/* ============================================================
   MÉTODOS DE PAGO DISPONIBLES
   Solo se muestran los que de verdad funcionan:
   · Contraentrega: siempre activo (el pedido se registra y se paga al recibir).
   · Tarjeta: está APAGADA. El formulario que existe es una simulación
     (no hay pasarela ni banco conectados) y no debe aparentar cobrar.
     Ponla en true únicamente cuando integres una pasarela real.
   · Nequi: se activa solo si completas NEQUI_NUMERO y NEQUI_TITULAR con
     los datos reales de tu cuenta. (Antes decía "300 000 0000": un marcador.)
   · PayPal: apagado, no hay integración.
   ============================================================ */
const PAGO_TARJETA_ACTIVO = false;
const PAGO_PAYPAL_ACTIVO  = false;
const NEQUI_NUMERO  = '';   // ej: '3001234567'
const NEQUI_TITULAR = '';   // ej: 'MAQUINA S.A.S.'
const PAGO_NEQUI_ACTIVO = !!(NEQUI_NUMERO.trim() && NEQUI_TITULAR.trim());

/* El catálogo se carga en segundo plano: lo necesita el botón "+"
   (para revisar stock) y el menú del encabezado. */
const catalogoListo = cargarCatalogo().then(() => renderHeader('carrito')).catch(e => console.error('Catálogo:', e));

/* Los costos de envío por zona también se cargan en segundo plano
   (pueden haber cambiado desde el panel). Si ya llegaron antes de
   que el cliente empiece a llenar el formulario, se repinta el
   carrito para que el desplegable de zona salga con el costo al
   día; si el cliente ya escribió algo, se deja tal cual para no
   perderle lo que ya llenó (el precio elegido en su momento sigue
   siendo válido para ESE pedido). */
function _checkoutTieneAlgoEscrito() {
  const ids = ['nombreCliente', 'emailCliente', 'telefonoCliente', 'direccionCliente'];
  if (ids.some(id => (document.getElementById(id)?.value || '').trim())) return true;
  if (document.getElementById('municipioEnvio')?.value) return true;
  return false;
}
const envioConfigListo = cargarConfigEnvio()
  .then(() => { if (typeof pintarCarrito === 'function' && !_checkoutTieneAlgoEscrito()) pintarCarrito(); })
  .catch(e => console.error('Envío:', e));

/* ---------- helpers ---------- */
function fmtDinero(n) {
  return '$' + Number(n || 0).toLocaleString('es-CO');
}
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function animarClase(el, clase) {
  if (!el) return;
  el.classList.remove(clase);
  void el.offsetWidth;            // reinicia la animación
  el.classList.add(clase);
}
const reducirMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Muestra un valor en pesos y, si cambió, lo "cuenta" hasta el nuevo número. */
function setDinero(el, valor) {
  if (!el) return;
  const desde = typeof el._valor === 'number' ? el._valor : valor;
  el._valor = valor;
  cancelAnimationFrame(el._raf);
  if (desde === valor || reducirMovimiento) { el.textContent = fmtDinero(valor); return; }
  const t0 = performance.now(), dur = 380;
  (function paso(t) {
    const p = Math.min(1, (t - t0) / dur);
    const suave = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtDinero(Math.round(desde + (valor - desde) * suave));
    if (p < 1) el._raf = requestAnimationFrame(paso);
  })(t0);
  animarClase(el, 'tick');
}

/** Nombre aproximado del color a partir de su HEX (el catálogo solo guarda el código). */
const PALETA_COLORES = [
  ['Negro', '#151512'], ['Gris oscuro', '#3a3a36'], ['Gris', '#83807a'], ['Blanco', '#faf9f5'],
  ['Hueso', '#eceae3'], ['Crema', '#f5ecd6'], ['Beige', '#d8c3a5'], ['Café', '#6b4423'],
  ['Verde menta', '#dfe8da'], ['Verde', '#2f6b4a'], ['Verde oscuro', '#1b4332'], ['Lila', '#e7d9ee'],
  ['Morado', '#6a3d9a'], ['Rosado', '#f3e0da'], ['Fucsia', '#d63384'], ['Rojo', '#c0392b'],
  ['Naranja', '#e67e22'], ['Amarillo', '#ffd600'], ['Azul claro', '#9ec5e8'], ['Azul', '#2d4a8a'],
];
function nombreColor(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return '';
  const rgb = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r, g, b] = rgb(m[1]);
  let mejor = '', dMin = Infinity;
  PALETA_COLORES.forEach(([nombre, h]) => {
    const [r2, g2, b2] = rgb(h.slice(1));
    const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2;
    if (d < dMin) { dMin = d; mejor = nombre; }
  });
  return mejor;
}

/* iconos minimalistas (trazo, heredan el color del texto) */
function svgCandado() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>';
}
function svgCamion() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v9h-11z"/><path d="M13.5 9.5h4l3 3.2v2.8h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>';
}
function svgBolsa() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>';
}
/* iconos de los métodos de pago (mismo trazo que los de arriba, para que
   los tres se vean consistentes y sin emojis) */
function svgIconoTarjeta() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.3" y="5.3" width="19.4" height="13.4" rx="2.6"/><path d="M2.3 9.6h19.4"/><path d="M6 14.4h4.2"/></svg>';
}
function svgIconoNequi() {
  /* Sin el logo oficial de Nequi disponible en el proyecto, usamos un
     icono genérico de celular con "pago confirmado" — mismo estilo que
     los otros dos, para no mezclar iconografías. */
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.6" y="2.3" width="10.8" height="19.4" rx="2.4"/><path d="M10 19h4"/><path d="M9.2 12.1l1.9 1.9 3.7-4"/></svg>';
}

/* Agrupa items idénticos (mismo id + color + talla) en uno solo con cantidad */
function agruparCarrito(carrito) {
  const grupos = [];
  carrito.forEach(item => {
    const existente = grupos.find(g => g.id == item.id && g.color === item.color && g.talla === item.talla);
    if (existente) { existente.cantidad++; existente.subtotal += Number(item.precio); }
    else grupos.push({ ...item, cantidad: 1, subtotal: Number(item.precio) });
  });
  return grupos;
}

/* ---------- iconos extra del carrito (trazo, heredan color) ---------- */
const _svg = (d, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const svgMas      = () => _svg('<path d="M12 5v14M5 12h14"/>', 2.2);
const svgMenos    = () => _svg('<path d="M5 12h14"/>', 2.2);
const svgBasura   = () => _svg('<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12.2a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8L18 7"/><path d="M9 7V4.8A1.8 1.8 0 0 1 10.8 3h2.4A1.8 1.8 0 0 1 15 4.8V7"/>');
const svgAlerta   = () => _svg('<path d="M12 3.5 2.8 19.5h18.4L12 3.5Z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>');
const svgInfo     = () => _svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/>');
const svgFlechaIz = () => _svg('<path d="M19 12H5M11 6l-6 6 6 6"/>');
const svgFlechaDe = () => _svg('<path d="M5 12h14M13 6l6 6-6 6"/>');
const svgCorazon  = () => _svg('<path d="M12 20.5s-7.6-4.6-10-9.3C.5 7.8 2.3 4.5 5.6 4c2-.3 3.9.7 5 2.3.1.15.3.15.4 0 1.1-1.6 3-2.6 5-2.3 3.3.5 5.1 3.8 3.6 7.2-2.4 4.7-10 9.3-10 9.3z"/>', 1.7);
const svgEscudo   = () => _svg('<path d="M12 3 4.5 6v5.5c0 4.6 3.1 8 7.5 9.5 4.4-1.5 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2.2 2.2L15.5 10"/>');

/* ---------- estado vacío ---------- */
function htmlChipsCategorias() {
  let cats = [];
  try { cats = (typeof categoriasDisponibles === 'function' ? categoriasDisponibles() : []).slice(0, 6); } catch (e) { cats = []; }
  return cats.map(c => `<a class="cart-chip" href="productos.html?cat=${encodeURIComponent(c)}">${esc(c)}</a>`).join('');
}
function htmlVacio() {
  const favs = typeof totalFavoritosCount === 'function' ? totalFavoritosCount() : 0;
  return `
    <div class="cart-empty">
      <div class="cart-empty-art" aria-hidden="true">
        <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
        <div class="cart-empty-bag">${svgBolsa()}</div>
      </div>
      <h2>Tu carrito está vacío</h2>
      <p>Todavía no has agregado nada. Explora la colección y arma tu fit.</p>
      <div class="cart-empty-actions">
        <a href="productos.html" class="btn-finalizar btn-inline">Ir a la tienda ${svgFlechaDe()}</a>
        ${favs > 0 ? `<a href="favoritos.html" class="btn-ghost">${svgCorazon()}<span>Ver mis favoritos (${favs})</span></a>` : ''}
      </div>
      <div class="cart-empty-chips" id="cartEmptyChips">${htmlChipsCategorias()}</div>
    </div>`;
}

/* ---------- una línea del carrito ---------- */
let _primeraPintura = true;
function htmlFilaInterior(g) {
  const i = g.info;
  const colorTxt = nombreColor(g.color);
  const noVendible = i.estado === 'no_disponible' || i.estado === 'agotado';
  const verificado = CarritoCore.estado.validacion === 'ok';
  const masPosibles = verificado && i.producto ? CarritoCore.cuantasMasSePuede(i.producto, g.color, g.talla, CarritoCore.leer()) : 1;
  const plusBloq = noVendible || (verificado && masPosibles <= 0);
  const enlace = i.producto && !noVendible ? `producto.html?id=${encodeURIComponent(g.id)}` : '';
  const nombre = enlace ? `<a href="${enlace}">${esc(g.nombre)}</a>` : esc(g.nombre);
  const pr = i.producto || {};
  const estiloFoto = `object-fit:${pr.ajusteFoto === 'contain' ? 'contain' : 'cover'};${pr.posicionFoto ? `object-position:${esc(pr.posicionFoto)};` : ''}`;
  const foto = g.foto ? `<img src="${esc(g.foto)}" alt="${esc(g.nombre)}" style="${estiloFoto}" loading="lazy" decoding="async">` : iconoProducto(g.icono, g.color || '#dfe8da');
  const conPrecioUnit = g.cantidad > 1 || i.ahorroUnidad > 0;

  let aviso = '';
  if (i.estado === 'no_disponible' || i.estado === 'agotado') {
    aviso = `<div class="cart-item-alert is-error" role="alert">${svgAlerta()}<div><b>${i.estado === 'agotado' ? 'Agotado' : 'No disponible'}</b><span>${esc(i.mensaje)} No se suma al total.</span></div><button type="button" class="alert-act" data-act="quitar">Quitar</button></div>`;
  } else if (i.estado === 'parcial') {
    aviso = `<div class="cart-item-alert is-warn" role="alert">${svgAlerta()}<div><b>Stock insuficiente</b><span>${esc(i.mensaje)}</span></div><button type="button" class="alert-act" data-act="ajustar" data-n="${i.disponible}">Ajustar a ${i.disponible}</button></div>`;
  } else if (i.pocoStock) {
    aviso = `<div class="cart-item-low">${svgInfo()}<span>${i.pocoStock === 1 ? '¡Última unidad!' : `¡Quedan solo ${i.pocoStock}!`}</span></div>`;
  }

  return `
    <a class="cart-item-media" ${enlace ? `href="${enlace}"` : 'aria-hidden="true" tabindex="-1"'}>${foto}${i.descuentoPct > 0 && !noVendible ? `<span class="cart-item-badge">-${i.descuentoPct}%</span>` : ''}</a>
    <div class="cart-item-info">
      <div class="cart-item-top">
        <div class="cart-item-heading">
          <h3 class="cart-item-name">${nombre}</h3>
          <p class="cart-item-meta">
            <span class="cart-swatch" style="background:${esc(g.color || '#dfe8da')}"></span>
            ${colorTxt ? `<span>${esc(colorTxt)}</span><span class="sep">·</span>` : ''}
            <span>Talla ${esc(g.talla || '—')}</span>
          </p>
        </div>
        <button type="button" class="btn-eliminar" aria-label="Quitar ${esc(g.nombre)} del carrito" title="Quitar">${svgBasura()}</button>
      </div>
      ${aviso}
      <div class="cart-item-bottom">
        <div class="qty-stepper" role="group" aria-label="Cantidad de ${esc(g.nombre)}">
          <button type="button" class="qty-btn qty-minus" aria-label="Quitar una unidad">${svgMenos()}</button>
          <span class="qty-value" aria-live="polite">${g.cantidad}</span>
          <button type="button" class="qty-btn qty-plus${plusBloq ? ' is-disabled' : ''}" aria-label="Agregar una unidad"${plusBloq ? ' aria-disabled="true"' : ''}>${svgMas()}</button>
        </div>
        <div class="cart-item-prices">
          <span class="cart-item-line">${fmtDinero(g.subtotal)}</span>
          <span class="cart-item-unit"${conPrecioUnit ? '' : ' hidden'}>${g.cantidad > 1
            ? `${i.ahorroUnidad > 0 ? `<s>${fmtDinero(i.base)}</s> ` : ''}${fmtDinero(g.precio)} c/u`
            : (i.ahorroUnidad > 0 ? `<s>${fmtDinero(i.base)}</s>` : '')}</span>
        </div>
      </div>
    </div>`;
}
function htmlFila(g, n) {
  const i = g.info;
  const cls = ['cart-item'];
  if (i.estado === 'no_disponible' || i.estado === 'agotado') cls.push('is-unavailable');
  else if (i.estado === 'parcial') cls.push('is-warning');
  return `<article class="${cls.join(' ')}" style="--i:${n || 0}" data-id="${esc(g.id)}" data-color="${esc(g.color)}" data-talla="${esc(g.talla)}">${htmlFilaInterior(g)}</article>`;
}

/* ---------- avisos sobre la lista (precios, stock, verificación) ---------- */
function htmlAvisos(a) {
  const est = CarritoCore.estado;
  let h = '';
  if (est.validacion === 'pendiente') {
    h += `<div class="cart-notice is-loading"><span class="spinner" aria-hidden="true"></span><span>Verificando precios y disponibilidad…</span></div>`;
  } else if (est.validacion === 'sin_verificar') {
    h += `<div class="cart-notice is-info">${svgInfo()}<span>No pudimos verificar precios y disponibilidad ahora mismo.</span><button type="button" class="notice-act" data-notice="reintentar">Reintentar</button></div>`;
  }
  est.avisosPrecio.forEach((av, k) => {
    const sube = av.ahora > av.antes;
    h += `<div class="cart-notice ${sube ? 'is-warn' : 'is-good'}" role="status">${svgInfo()}<span>El precio de <b>${esc(av.nombre)}</b>${av.talla ? ` (talla ${esc(av.talla)})` : ''} ${sube ? 'subió' : 'bajó'}: antes ${fmtDinero(av.antes)}, ahora <b>${fmtDinero(av.ahora)}</b>.</span><button type="button" class="notice-x" data-notice="cerrar" data-k="${k}" aria-label="Cerrar aviso">×</button></div>`;
  });
  if (a.verificado && a.problemas > 0) {
    const hayQuitar = a.grupos.some(g => g.info.estado === 'no_disponible' || g.info.estado === 'agotado');
    h += `<div class="cart-notice is-error" role="alert">${svgAlerta()}<span>${a.problemas === 1 ? 'Hay 1 producto que' : `Hay ${a.problemas} productos que`} necesita${a.problemas === 1 ? '' : 'n'} tu atención antes de pagar.</span>${hayQuitar ? '<button type="button" class="notice-act" data-notice="quitar-malos">Quitar no disponibles</button>' : ''}</div>`;
  }
  return h;
}

function pintarCarrito() {
  const carrito = CarritoCore.leer();
  const wrap = document.getElementById('carritoWrap');

  if (carrito.length === 0) {
    wrap.innerHTML = htmlVacio();
    if (typeof actualizarBarraMovil === 'function') actualizarBarraMovil(null);
    return;
  }

  const analisisInicial = CarritoCore.analizar(carrito);
  const totalUnidades = analisisInicial.unidades;
  const itemsHtml = analisisInicial.grupos.map((g, n) => htmlFila(g, n)).join('');
  const subtotalInicial = analisisInicial.subtotal;
  const html = `
    <div class="checkout-stepper" id="checkoutStepper">
      <div class="stepper-step is-active" data-stepper="1">

  wrap.innerHTML = html;

  /* ---------- resumen: subtotal / descuentos / envío / total (se actualiza solo) ---------- */
  const listEl = document.getElementById('cartList');
  const selectMunicipio = document.getElementById('municipioEnvio');
  const envioValorEl = document.getElementById('envioValor');
  const totalValorEl = document.getElementById('totalValor');
  let envioZona = 0;     // costo del envío según el municipio elegido
  let envioActual = 0;   // costo que de verdad se cobra (0 si aplica envío gratis)

  /** ¿Qué impide pagar ahora mismo? ('' = nada) */
  function motivoBloqueo(a) {
    if (a.estadoValidacion === 'pendiente') return 'cargando';
    if (a.verificado && a.problemas > 0) return 'problemas';
    if (a.unidadesValidas === 0) return 'vacio';
    return '';
  }

  function recalcularResumen() {
    const a = CarritoCore.analizar();
    const subtotal = a.subtotal;
    const gratis = ENVIO_GRATIS_DESDE > 0 && subtotal >= ENVIO_GRATIS_DESDE;
    envioActual = gratis ? 0 : envioZona;

    setDinero(document.getElementById('subtotalValor'), subtotal);
    const conDesc = a.descuentos > 0;
    const filaLista = document.getElementById('listaFila'), filaDesc = document.getElementById('descFila');
    if (filaLista) { filaLista.hidden = !conDesc; setDinero(document.getElementById('listaValor'), a.lista); }
    if (filaDesc) {
      filaDesc.hidden = !conDesc;
      const dv = document.getElementById('descValor');
      if (dv) dv.textContent = '−' + fmtDinero(a.descuentos);
    }
    const ahorro = document.getElementById('ahorroTxt');
    if (ahorro) { ahorro.hidden = !conDesc; if (conDesc) ahorro.textContent = `Estás ahorrando ${fmtDinero(a.descuentos)} en este pedido`; }

    const filaEnvio = document.getElementById('envioFila');
    if (filaEnvio) filaEnvio.classList.toggle('is-free', gratis);
    if (gratis) envioValorEl.textContent = '¡Gratis!';
    else envioValorEl.textContent = envioZona ? fmtDinero(envioZona) : 'Se calcula al elegir tu municipio';
    setDinero(totalValorEl, subtotal + envioActual);

    const banner = document.getElementById('shipBanner');
    if (banner) {
      const falta = Math.max(0, ENVIO_GRATIS_DESDE - subtotal);
      banner.classList.toggle('is-done', gratis);
      document.getElementById('shipBannerTxt').textContent = gratis
        ? '¡Envío gratis!'
        : `Te faltan ${fmtDinero(falta)} para el envío gratis`;
      document.getElementById('shipBar').style.width = Math.min(100, Math.round(subtotal / ENVIO_GRATIS_DESDE * 100)) + '%';
    }

    // si ya eligió Nequi, el valor a transferir tiene que seguir al total
    const chipActivo = wrap.querySelector('.metodo-card.active');
    const nequiValor = document.getElementById('nequiValorTxt');
    if (chipActivo && chipActivo.dataset.metodo === 'nequi' && nequiValor) nequiValor.textContent = totalValorEl.textContent;

    // botón "Finalizar": bloqueado (sin deshabilitarlo) mientras haya algo por resolver
    const motivo = motivoBloqueo(a);
    const btn = document.getElementById('btnFinalizar'), msg = document.getElementById('cartBloqueoMsg');
    if (btn) {
      btn.classList.toggle('is-blocked', !!motivo && motivo !== 'cargando');
      btn.classList.toggle('is-loading', motivo === 'cargando');
      btn.setAttribute('aria-disabled', motivo ? 'true' : 'false');
    }
    if (msg) {
      msg.hidden = !motivo;
      msg.textContent = motivo === 'cargando' ? 'Verificando disponibilidad…'
        : motivo === 'problemas' ? 'Resuelve los avisos de tus productos para poder pagar.'
        : motivo === 'vacio' ? 'No hay productos disponibles para comprar.' : '';
    }
    if (typeof actualizarBarraMovil === 'function') actualizarBarraMovil(a, subtotal + envioActual, motivo);
  }

  function actualizarContadores() {
    const n = totalCarritoCount();
    const hdr = document.getElementById('cartCount');
    if (hdr) { hdr.textContent = n; animarClase(hdr, 'bump'); }
    const c = document.getElementById('cartListCount');
    const w = document.getElementById('cartListWord');
    if (c) c.textContent = n;
    if (w) w.textContent = n === 1 ? 'producto' : 'productos';
  }

  /** Repinta lista, avisos y resumen SIN tocar el formulario (no se pierde lo escrito). */
  function refrescar() {
    const a = CarritoCore.analizar();
    if (!a.grupos.length) { pintarCarrito(); return; }
    if (!document.getElementById('cartList')) { pintarCarrito(); return; }
    listEl.classList.remove('is-first');
    listEl.innerHTML = a.grupos.map((g, n) => htmlFila(g, n)).join('');
    document.getElementById('cartNotices').innerHTML = htmlAvisos(a);
    recalcularResumen();
    actualizarContadores();
  }
  window.__carrito = { refrescar, recalcularResumen };

  /* ---------- filas: cambiar cantidad / quitar (sin repintar todo) ---------- */
  function quitarFilaAnimada(fila) {
    if (fila.dataset.saliendo) return;
    fila.dataset.saliendo = '1';
    fila.style.maxHeight = fila.offsetHeight + 'px';
    void fila.offsetWidth;
    fila.classList.add('is-leaving');
    setTimeout(() => {
      fila.remove();
      if (!listEl.querySelector('.cart-item')) pintarCarrito();   // ya no queda nada: estado vacío
    }, reducirMovimiento ? 0 : 340);
  }

  /** Rehace por dentro UNA fila con los datos actuales (conserva el foco del teclado). */
  function refrescarFila(fila) {
    const { id, color, talla } = fila.dataset;
    const a = CarritoCore.analizar();
    const g = a.grupos.find(x => x.id == id && x.color === color && x.talla === talla);
    if (!g) { quitarFilaAnimada(fila); return; }
    const activo = document.activeElement;
    const claseFoco = fila.contains(activo) ? ['qty-plus', 'qty-minus', 'btn-eliminar'].find(c => activo.classList.contains(c)) : null;
    const lineaPrev = fila.querySelector('.cart-item-line');
    const prev = lineaPrev && typeof lineaPrev._valor === 'number' ? lineaPrev._valor : null;
    fila.classList.toggle('is-unavailable', g.info.estado === 'no_disponible' || g.info.estado === 'agotado');
    fila.classList.toggle('is-warning', g.info.estado === 'parcial');
    fila.innerHTML = htmlFilaInterior(g);
    const linea = fila.querySelector('.cart-item-line');
    if (linea) { if (prev !== null) linea._valor = prev; setDinero(linea, g.subtotal); }
    animarClase(fila.querySelector('.qty-value'), 'bump');
    animarClase(fila, 'flash');
    if (claseFoco) (fila.querySelector('.' + claseFoco) || fila.querySelector('.qty-minus'))?.focus({ preventScroll: true });
  }

  function despuesDeCambio(fila) {
    refrescarFila(fila);
    document.getElementById('cartNotices').innerHTML = htmlAvisos(CarritoCore.analizar());
    recalcularResumen();
    actualizarContadores();
  }

  function deshacerA(instantanea) {
    return () => {
      _guardar(LS_KEYS.carrito, instantanea);
      if (document.getElementById('cartList')) window.__carrito.refrescar(); else pintarCarrito();
      actualizarContadoresGlobal();
    };
  }

  listEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.qty-plus, .qty-minus, .btn-eliminar, [data-act]');
    if (!btn) return;
    e.preventDefault();
    const fila = btn.closest('.cart-item');
    if (!fila || fila.dataset.saliendo) return;
    const { id, color, talla } = fila.dataset;
    const antes = CarritoCore.leer();
    const cantidadAntes = antes.filter(it => it.id == id && it.color === color && it.talla === talla).length;
    const nombreProd = (antes.find(it => it.id == id) || {}).nombre || 'producto';

    if (btn.dataset.act === 'ajustar') {
      CarritoCore.ajustarAlStock(id, color, talla, Number(btn.dataset.n) || 0);
      despuesDeCambio(fila);
      return;
    }
    if (btn.dataset.act === 'quitar' || btn.classList.contains('btn-eliminar') || (btn.classList.contains('qty-minus') && cantidadAntes <= 1)) {
      eliminarGrupo(id, color, talla);
      despuesDeCambio(fila);
      mostrarSnack(`Quitaste «${nombreProd}»`, 'Deshacer', deshacerA(antes));
      return;
    }
    if (btn.classList.contains('qty-plus')) {
      if (btn.classList.contains('is-loading')) return;
      if (CarritoCore.estado.validacion === 'pendiente') {       // necesitamos el catálogo para revisar el stock
        btn.classList.add('is-loading');
        await catalogoListo;
        btn.classList.remove('is-loading');
      }
      const producto = buscarProducto(id);
      if (!producto) { showToastCarrito('No pudimos revisar el stock de este producto ahora mismo. Intenta de nuevo.'); return; }
      if (!CarritoCore.vendible(producto)) { showToastCarrito(`${producto.nombre} ya no está disponible.`); refrescar(); return; }
      const mas = CarritoCore.cuantasMasSePuede(producto, color, talla, CarritoCore.leer());
      if (mas <= 0) {
        const tope = CarritoCore.topeVariante(producto, color, talla);
        showToastCarrito(tope <= 0 ? `${producto.nombre} está agotado en esa combinación.` : `Ya tienes todas las unidades disponibles (${tope}) de ${producto.nombre} en ese color y talla.`);
        animarClase(fila, 'shake');
        return;
      }
      agregarAlCarrito(producto, color, talla);
    } else if (btn.classList.contains('qty-minus')) {
      quitarUnidad(id, color, talla);
    }
    despuesDeCambio(fila);
  });

  /* ---------- avisos sobre la lista ---------- */
  document.getElementById('cartNotices').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-notice]');
    if (!b) return;
    const acc = b.dataset.notice;
    if (acc === 'cerrar') { CarritoCore.estado.avisosPrecio.splice(Number(b.dataset.k), 1); refrescar(); }
    else if (acc === 'reintentar') { b.classList.add('is-busy'); await revalidar(); }
    else if (acc === 'quitar-malos') {
      const antes = CarritoCore.leer();
      CarritoCore.quitarNoDisponibles();
      refrescar();
      actualizarContadoresGlobal();
      mostrarSnack('Quitamos los productos no disponibles', 'Deshacer', deshacerA(antes));
    }
  });

  const btnLimpiar = document.getElementById('btnLimpiar');
  if (btnLimpiar) {
    btnLimpiar.addEventListener('click', (e) => {
      e.preventDefault();
      const antes = CarritoCore.leer();
      limpiarCarrito();
      listEl.querySelectorAll('.cart-item').forEach((fila, i) => setTimeout(() => quitarFilaAnimada(fila), reducirMovimiento ? 0 : i * 70));
      recalcularResumen();
      actualizarContadores();
      mostrarSnack('Vaciaste el carrito', 'Deshacer', deshacerA(antes));
    });
  }

  /* ---------- protección: no se puede pagar con productos agotados o sin verificar ----------
     Se engancha en la fase de captura, ANTES de la lógica del formulario, y no la modifica. */
  const _btnFin = document.getElementById('btnFinalizar');
  const _formPago = document.getElementById('form-pago');
  function avisarBloqueo(motivo) {
    if (motivo === 'cargando') showToastCarrito('Estamos verificando la disponibilidad. Un momento…');
    else if (motivo === 'problemas') { showToastCarrito('Resuelve los avisos de tu carrito antes de pagar.'); document.getElementById('cartNotices').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'center' }); }
    else showToastCarrito('Tu carrito no tiene productos disponibles para comprar.');
  }
  if (_btnFin) {
    let _reenviando = false;
    _btnFin.addEventListener('click', async (e) => {
      if (_reenviando) return;
      const motivo = motivoBloqueo(CarritoCore.analizar());
      if (motivo) { e.preventDefault(); e.stopImmediatePropagation(); avisarBloqueo(motivo); return; }
      // datos viejos (>45 s): se vuelve a consultar Firestore justo antes de seguir
      if (Date.now() - CarritoCore.estado.fecha > 45000) {
        e.preventDefault(); e.stopImmediatePropagation();
        _btnFin.classList.add('is-loading');
        await revalidar();
        _btnFin.classList.remove('is-loading');
        const m2 = motivoBloqueo(CarritoCore.analizar());
        if (m2) { avisarBloqueo(m2); return; }
        _reenviando = true; _btnFin.click(); _reenviando = false;
      }
    }, true);
  }
  if (_formPago) {
    _formPago.addEventListener('submit', (e) => {
      const motivo = motivoBloqueo(CarritoCore.analizar());
      if (motivo) { e.preventDefault(); e.stopImmediatePropagation(); avisarBloqueo(motivo); }
    }, true);
  }

  /* ---- envío dinámico según municipio elegido ---- */
  if (selectMunicipio) {
    selectMunicipio.addEventListener('change', () => {
      const opt = selectMunicipio.selectedOptions[0];
      envioZona = opt ? Number(opt.dataset.costo || 0) : 0;
      recalcularResumen();
    });
  }
  recalcularResumen();

  /* ---- buscador de municipio (autocompletar sobre el <select> real) ----
     Busca entre los 125 municipios de Antioquia (sin importar tildes ni
     mayúsculas) y, al elegir uno, selecciona solo la zona de envío que le
     corresponde. Al final siempre quedan "Vereda / zona rural" y "Otra
     ciudad de Colombia" para quien no vive en un casco urbano de Antioquia. */
  const municipioInput = document.getElementById('municipioInput');
  const municipioSugerencias = document.getElementById('municipioSugerencias');
  let municipioElegidoNombre = '';   // nombre tal cual lo eligió el cliente (ej. "Barbosa")
  if (municipioInput && selectMunicipio) {
    const quitarTildes = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const fmtCosto = (n) => '$' + Number(n).toLocaleString('es-CO');
    const municipios = municipiosAntioquia().map(m => ({ ...m, detalle: 'Antioquia', clave: quitarTildes(m.nombre) }));
    const zonasGenericas = zonasEnvio()
      .filter(z => z.id === 'vereda' || z.id === 'otra_ciudad')
      .map(z => ({ nombre: z.nombre, zona: z.id, costo: z.costo, detalle: '', clave: quitarTildes(z.nombre) }));

    function fila(m, i) {
      return `<button type="button" class="municipio-sug" data-i="${i}"><span>${esc(m.nombre)}${m.detalle ? ` <small style="opacity:.6">· ${m.detalle}</small>` : ''}</span><span class="municipio-sug-costo">${fmtCosto(m.costo)}</span></button>`;
    }

    let visibles = [];
    let coincidencias = [];
    function pintarSugerencias(filtro) {
      const q = quitarTildes(filtro || '');
      let lista = q ? municipios.filter(m => m.clave.includes(q)) : municipios.slice();
      // primero los que EMPIEZAN con lo escrito ("bar" -> Barbosa antes que "Abriaquí")
      if (q) lista.sort((a, b) => (b.clave.startsWith(q) - a.clave.startsWith(q)) || a.nombre.localeCompare(b.nombre, 'es'));
      coincidencias = lista;
      visibles = lista.concat(zonasGenericas);
      let html = '';
      if (!lista.length) html += `<div class="municipio-sug-vacio">No encontramos "${esc(filtro)}" en Antioquia. Si vives en otra ciudad o en el campo, elige una opción de abajo 👇</div>`;
      html += visibles.map(fila).join('');
      municipioSugerencias.innerHTML = html;
      municipioSugerencias.querySelectorAll('.municipio-sug').forEach(btn => {
        btn.addEventListener('click', () => elegir(visibles[Number(btn.dataset.i)]));
      });
    }

    function elegir(m) {
      if (!m) return;
      municipioElegidoNombre = m.nombre;
      municipioInput.value = m.nombre;
      selectMunicipio.value = m.zona;
      selectMunicipio.dispatchEvent(new Event('change'));
      municipioSugerencias.classList.remove('open');
    }

    municipioInput.addEventListener('focus', () => { pintarSugerencias(municipioInput.value === municipioElegidoNombre ? '' : municipioInput.value); municipioSugerencias.classList.add('open'); });
    municipioInput.addEventListener('input', () => {
      // si el cliente cambia el texto, la elección anterior ya no vale
      if (municipioInput.value !== municipioElegidoNombre) {
        municipioElegidoNombre = '';
        selectMunicipio.value = '';
        selectMunicipio.dispatchEvent(new Event('change'));
      }
      pintarSugerencias(municipioInput.value);
      municipioSugerencias.classList.add('open');
    });
    // Enter con la lista abierta = elegir la primera coincidencia (en vez de "Siguiente")
    municipioInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !municipioSugerencias.classList.contains('open') || !municipioInput.value.trim()) return;
      const q = quitarTildes(municipioInput.value);
      const exacto = municipios.find(m => m.clave === q);
      const primero = exacto || coincidencias[0];
      if (primero) { e.preventDefault(); e.stopImmediatePropagation(); elegir(primero); }
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#municipioAutocomplete')) municipioSugerencias.classList.remove('open');
    });
  }

  /* ---- mapa para ubicar la dirección (Leaflet + OpenStreetMap, sin API key) ---- */
  const btnMostrarMapa = document.getElementById('btnMostrarMapa');
  const mapaWrap = document.getElementById('mapaWrap');
  const btnMiUbicacion = document.getElementById('btnMiUbicacion');
  const mapaHint = document.getElementById('mapaHint');
  let mapaLeaflet = null, marcadorLeaflet = null;

  function inicializarMapa(lat, lng) {
    if (mapaLeaflet) { mapaLeaflet.invalidateSize(); return; }
    mapaLeaflet = L.map('mapaEnvio').setView([lat, lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(mapaLeaflet);
    marcadorLeaflet = L.marker([lat, lng], { draggable: true }).addTo(mapaLeaflet);

    async function ubicarDesdePunto(latlng) {
      marcadorLeaflet.setLatLng(latlng);
      mapaHint.textContent = 'Buscando la dirección de ese punto...';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`);
        const data = await res.json();
        const direccionTexto = data && data.display_name ? data.display_name.split(',').slice(0, 3).join(',') : '';
        if (direccionTexto) {
          document.getElementById('direccionCliente').value = direccionTexto;
          mapaHint.textContent = '📍 Dirección ubicada: ' + direccionTexto;
        } else {
          mapaHint.textContent = 'Ubicamos el punto en el mapa, pero escribe la dirección manualmente por si acaso.';
        }
      } catch (err) {
        mapaHint.textContent = 'No pudimos leer la dirección automáticamente, pero el punto quedó marcado en el mapa.';
      }
    }

    mapaLeaflet.on('click', (e) => ubicarDesdePunto(e.latlng));
    marcadorLeaflet.on('dragend', () => ubicarDesdePunto(marcadorLeaflet.getLatLng()));
  }

  if (btnMostrarMapa) {
    btnMostrarMapa.addEventListener('click', () => {
      const yaAbierto = mapaWrap.classList.toggle('open');
      btnMostrarMapa.textContent = yaAbierto ? '📍 Ocultar el mapa' : '📍 ¿No sabes bien tu dirección? Ubícala en el mapa';
      if (yaAbierto) setTimeout(() => inicializarMapa(6.2442, -75.5812), 150); // centro por defecto: Medellín
    });
  }

  if (btnMiUbicacion) {
    btnMiUbicacion.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showToastCarrito('Tu navegador no permite compartir ubicación.');
        return;
      }
      mapaHint.textContent = 'Buscando tu ubicación...';
      navigator.geolocation.getCurrentPosition((pos) => {
        const { latitude, longitude } = pos.coords;
        if (!mapaLeaflet) inicializarMapa(latitude, longitude);
        mapaLeaflet.setView([latitude, longitude], 16);
        marcadorLeaflet.setLatLng([latitude, longitude]);
        marcadorLeaflet.fire('dragend');
      }, () => {
        showToastCarrito('No pudimos acceder a tu ubicación. Actívala en el navegador o marca el punto en el mapa.');
      });
    });
  }

  /* ---- acordeón de pasos del checkout ---- */
  const steps = wrap.querySelectorAll('.checkout-step');

  function refrescarNum(step) {
    const numEl = step.querySelector('.step-num');
    numEl.textContent = step.classList.contains('done') ? '✓' : step.dataset.step;
  }

  function activarPaso(n) {
    steps.forEach(s => {
      s.classList.toggle('open', Number(s.dataset.step) === n);
      refrescarNum(s);
    });
    activarStepper(n);
    // El CTA "Finalizar compra" solo se muestra al llegar al paso de pago;
    // en los pasos 1 y 2 el resumen solo enseña subtotal / envío / total.
    const acciones = document.getElementById('resumenAcciones');
    if (acciones) acciones.classList.toggle('visible', n === 3);
    const txtBtn = document.getElementById('btnFinalizarTxt');
    if (txtBtn) txtBtn.textContent = n === 3 ? 'Finalizar compra' : 'Proceder al pago';
  }

  /* ---- stepper de arriba (Carrito → Tus datos → Envío → Pago) ---- */
  const stepperSteps = wrap.querySelectorAll('.stepper-step');
  const stepperLines = wrap.querySelectorAll('.stepper-line');
  function activarStepper(n) {
    stepperSteps.forEach(s => {
      const num = Number(s.dataset.stepper);
      const circle = s.querySelector('.stepper-circle');
      s.classList.remove('is-active', 'is-done');
      if (num < n) { s.classList.add('is-done'); circle.textContent = '✓'; }
      else { circle.textContent = num; if (num === n) s.classList.add('is-active'); }
    });
    stepperLines.forEach(l => l.classList.toggle('is-done', Number(l.dataset.line) < n));
  }

  steps.forEach(step => {
    step.querySelector('.step-header').addEventListener('click', () => {
      activarPaso(Number(step.dataset.step));
    });
  });

  const btnContinuar1 = wrap.querySelector('.checkout-step[data-step="1"] .btn-continuar');
  if (btnContinuar1) {
    btnContinuar1.addEventListener('click', () => {
      const step = btnContinuar1.closest('.checkout-step');
      if (!validarPaso1()) return;
      const nombre = document.getElementById('nombreCliente').value.trim();
      step.classList.add('done');
      step.querySelector('.step-summary').textContent = nombre;
      activarPaso(2);
    });
  }

  const btnContinuar2 = wrap.querySelector('.checkout-step[data-step="2"] .btn-continuar');
  if (btnContinuar2) {
    btnContinuar2.addEventListener('click', () => {
      const step = btnContinuar2.closest('.checkout-step');
      if (!validarPaso2()) return;
      const sel = document.getElementById('municipioEnvio');
      step.classList.add('done');
      step.querySelector('.step-summary').textContent = (typeof municipioElegidoNombre !== 'undefined' && municipioElegidoNombre) || sel.selectedOptions[0].textContent.split(' — ')[0];
      activarPaso(3);
    });
  }

  wrap.querySelectorAll('.checkout-step[data-step="1"] input, .checkout-step[data-step="2"] input').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); e.target.closest('.checkout-step').querySelector('.btn-continuar').click(); }
    });
    // Quita el borde rojo apenas el cliente empieza a corregir el campo.
    inp.addEventListener('input', () => inp.classList.remove('campo-error'));
  });
  const selMunicipioErr = document.getElementById('municipioEnvio');
  if (selMunicipioErr) selMunicipioErr.addEventListener('change', () => selMunicipioErr.classList.remove('campo-error'));

  /* ---- selector de método de pago ---- */
  let metodoPago = null;
  const chips = wrap.querySelectorAll('.metodo-card');
  const camposTarjeta = document.getElementById('camposTarjeta');
  const camposNequi = document.getElementById('camposNequi');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      metodoPago = chip.dataset.metodo;
      camposTarjeta.classList.toggle('open', metodoPago === 'tarjeta');
      camposNequi.classList.toggle('open', metodoPago === 'nequi');
      if (metodoPago === 'nequi') {
        // Total a transferir: lo mismo que ya se muestra en el resumen del pedido.
        const totalTxt = document.getElementById('totalValor');
        document.getElementById('nequiValorTxt').textContent = totalTxt ? totalTxt.textContent : '$0';
      }
      actualizarEstadoFinalizar();
    });
  });

  /* ---- "Finalizar compra": habilitado solo cuando los 3 pasos están
    completos (datos + dirección + método de pago). Si falta algo, se ve
    apagado y el texto de abajo dice qué falta — pero se puede seguir
     tocando: lleva directo al paso que falta, igual que antes. ---- */
  function actualizarEstadoFinalizar() {
    const btn = document.getElementById('btnFinalizar');
    const hint = document.getElementById('finalizarHint');
    if (!btn) return;
    const faltan = [];
    if (!paso1Completo()) faltan.push('tus datos');
    if (!paso2Completo()) faltan.push('tu dirección');
    if (!metodoPago) faltan.push('el método de pago');
    const listo = faltan.length === 0;
    btn.classList.toggle('is-incompleto', !listo);
    btn.setAttribute('aria-disabled', String(!listo));
    if (hint) hint.textContent = listo ? '' : 'Falta: ' + faltan.join(', ') + '.';
  }
  if (chips.length === 1) chips[0].click();   // un único método disponible: ya queda elegido
  wrap.addEventListener('input', actualizarEstadoFinalizar);
  wrap.addEventListener('change', actualizarEstadoFinalizar);
  actualizarEstadoFinalizar(); // estado inicial del botón, ya con "metodoPago" declarado

  /* ---- botón "Copiar" de los datos de Nequi ---- */
  wrap.querySelectorAll('.nequi-copiar').forEach(btn => {
    btn.addEventListener('click', () => {
      const texto = document.getElementById(btn.dataset.copiar).textContent.trim();
      navigator.clipboard?.writeText(texto);
      showToastCarrito('Copiado: ' + texto);
    });
  });

  /* ---- tarjeta animada: formateo en vivo + flip al CVV ---- */
  const inNumero = document.getElementById('tarjetaNumero');
  const inTitular = document.getElementById('tarjetaTitular');
  const inVenc = document.getElementById('tarjetaVencimiento');
  const inCvv = document.getElementById('tarjetaCvv');
  const tarjetaVisual = document.getElementById('tarjetaVisual');

  if (inNumero) {
    inNumero.addEventListener('input', () => {
      let v = inNumero.value.replace(/\D/g, '').slice(0, 16);
      inNumero.value = v.replace(/(.{4})/g, '$1 ').trim();
      document.getElementById('tarjetaNumeroVista').textContent = v
        ? v.padEnd(16, '•').replace(/(.{4})/g, '$1 ').trim()
        : '•••• •••• •••• ••••';
    });
  }
  if (inTitular) {
    inTitular.addEventListener('input', () => {
      document.getElementById('tarjetaTitularVista').textContent = inTitular.value.trim().toUpperCase() || 'TU NOMBRE AQUÍ';
    });
  }
  if (inVenc) {
    inVenc.addEventListener('input', () => {
      let v = inVenc.value.replace(/\D/g, '').slice(0, 4);
      if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
      inVenc.value = v;
      document.getElementById('tarjetaVencVista').textContent = v || 'MM/AA';
    });
  }
  if (inCvv) {
    inCvv.addEventListener('input', () => {
      inCvv.value = inCvv.value.replace(/\D/g, '').slice(0, 4);
      document.getElementById('tarjetaCvvVista').textContent = inCvv.value.padEnd(3, '•');
    });
    inCvv.addEventListener('focus', () => tarjetaVisual.classList.add('flip'));
    inCvv.addEventListener('blur', () => tarjetaVisual.classList.remove('flip'));
  }

  const formPago = document.getElementById('form-pago');
  let enviandoPedido = false; // evita que un doble clic / doble Enter mande el pedido dos veces
  if (formPago) {
    const btnPagar = formPago.querySelector('.btn-pagar');
    formPago.addEventListener('submit', (e) => {
      e.preventDefault();
      if (enviandoPedido) return; // ya se está procesando un envío, ignora clics extra

      const nombre = document.getElementById('nombreCliente').value.trim();
      const email  = document.getElementById('emailCliente').value.trim();
      const telefono = document.getElementById('telefonoCliente').value.trim();
      const municipioOpt = selectMunicipio ? selectMunicipio.selectedOptions[0] : null;
      const municipio = selectMunicipio ? selectMunicipio.value : '';
      const barrio = document.getElementById('barrioCliente').value.trim();
      const vereda = document.getElementById('veredaCliente').value.trim();
      const direccion = document.getElementById('direccionCliente').value.trim();
      const edificio = document.getElementById('edificioCliente').value.trim();
      const referencia = document.getElementById('referenciaCliente').value.trim();

      // Revalida los pasos 1 y 2 por si el cliente saltó ahí con el mapa
      // de pasos de arriba sin pasar por los botones "Siguiente".
      if (!validarPaso1()) { activarPaso(1); return; }
      if (!validarPaso2()) { activarPaso(2); return; }

      if (!metodoPago) {
        showToastCarrito('Elige un método de pago.');
        return;
      }
      let tarjetaFinal = null;
      if (metodoPago === 'tarjeta') {
        const numLimpio = inNumero.value.replace(/\D/g, '');
        if (numLimpio.length < 16 || !inTitular.value.trim() || inVenc.value.length < 5 || inCvv.value.length < 3) {
          showToastCarrito('Revisa los datos de tu tarjeta.');
          return;
        }
        tarjetaFinal = numLimpio.slice(-4);
      }
      if (metodoPago === 'nequi') {
        const chk = document.getElementById('nequiConfirmado');
        if (!chk || !chk.checked) {
          showToastCarrito('Confirma que ya hiciste la transferencia por Nequi.');
          return;
        }
      }

      // Antes de intentar cobrar, confirma que hay internet — si no,
      // avisamos de una vez en vez de dejar al cliente mirando el
      // overlay de "comprobando pago" sin que nada pase.
      if (!navigator.onLine) {
        actualizarAvisoOffline();
        showToastCarrito('No tienes conexión a internet. Conéctate e intenta de nuevo.');
        return;
      }

      const envio = {
        municipio: municipioElegidoNombre || (municipioOpt ? municipioOpt.textContent.split(' — ')[0] : municipio),
        costo: envioActual,
        barrio, vereda, direccion, edificio, referencia,
      };

      enviandoPedido = true;
      if (btnPagar) { btnPagar.disabled = true; btnPagar.textContent = 'Procesando...'; }
      const btnFinalizarProc = document.getElementById('btnFinalizar');
      if (btnFinalizarProc) btnFinalizarProc.disabled = true;
      mostrarOverlay(metodoPago);

      setTimeout(async () => {
        try {
          const pedido = await crearPedido({ nombre, email, telefono, metodoPago, tarjetaFinal, envio });
          mostrarExito(nombre, pedido.codigo_pedido, pedido.items, metodoPago, {
            subtotal: pedido.subtotal, envio: pedido.costo_envio, total: pedido.total,
          });
          document.getElementById('cartCount').textContent = 0;
          // No reactivamos el botón: el pedido ya quedó hecho y el
          // carrito se va a vaciar / redibujar.
        } catch (err) {
          console.error('Error al confirmar el pedido:', err);
          enviandoPedido = false;
          if (btnPagar) { btnPagar.disabled = false; btnPagar.textContent = 'Confirmar pedido'; }
          if (btnFinalizarProc) btnFinalizarProc.disabled = false;

          if (!navigator.onLine) {
            mostrarError('Se perdió la conexión a internet justo al pagar. No te preocupes, no se cobró nada — conéctate e intenta de nuevo.');
          } else if (err && err.code === 'SIN_STOCK') {
            mostrarError(err.message || 'Uno de los productos de tu carrito ya se agotó. Vuelve al carrito y ajusta la cantidad.');
          } else if (err && err.code === 'SIN_PRODUCTO') {
            mostrarError('Uno de los productos de tu carrito ya no está disponible. Vuelve al carrito y quítalo.');
          } else {
            mostrarError('No se pudo procesar tu pedido por un problema de conexión con el servidor. Intenta de nuevo en un momento.');
          }
        }
      }, 1600);
    });
  }

  /* ---- "Finalizar compra" (resumen): lleva al paso que falta o confirma el pedido ---- */
  const btnFinalizar = document.getElementById('btnFinalizar');
  if (btnFinalizar && formPago) {
    btnFinalizar.addEventListener('click', () => {
      const caja = wrap.querySelector('.pagar-box');
      const irAlFormulario = () => { if (caja) caja.scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'start' }); };
      const valor = id => (document.getElementById(id).value || '').trim();

      // formulario todavía vacío: solo lo abrimos, sin llenarlo de errores rojos
      if (!valor('nombreCliente') && !valor('emailCliente') && !valor('telefonoCliente')) {
        activarPaso(1);
        irAlFormulario();
        setTimeout(() => document.getElementById('nombreCliente').focus({ preventScroll: true }), 450);
        return;
      }
      if (!validarPaso1()) { activarPaso(1); irAlFormulario(); return; }
      if (!validarPaso2()) { activarPaso(2); irAlFormulario(); return; }
      if (!metodoPago) { activarPaso(3); irAlFormulario(); showToastCarrito('Elige un método de pago.'); return; }
      if (formPago.requestSubmit) formPago.requestSubmit();
      else formPago.querySelector('.btn-pagar').click();
    });
  }

  /* ---- PayPal: todavía no hay pasarela conectada, así que avisamos con honestidad ---- */
  const btnPaypal = document.getElementById('btnPaypal');
  if (btnPaypal) {
    btnPaypal.addEventListener('click', () => {
      showToastCarrito('PayPal llega muy pronto ⚡ Por ahora paga con tarjeta, Nequi o contraentrega.');
    });
  }
}

/* ---------- validación real de campos del checkout ---------- */

/** Correo con forma válida: algo@algo.algo (sin espacios). */
function emailValido(valor) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor);
}
/** Teléfono colombiano razonable: 7 a 10 dígitos, dejando de lado
    espacios, guiones y el +57 si lo escriben. */
function telefonoValido(valor) {
  const soloDigitos = valor.replace(/\D/g, '').replace(/^57/, '');
  return soloDigitos.length >= 7 && soloDigitos.length <= 10;
}

/** Igual que validarPaso1/2, pero sin pintar nada en rojo — solo dicen si el
    paso ya quedó completo. Las usa el botón "Finalizar compra" del resumen. */
function paso1Completo() {
  const nombre = (document.getElementById('nombreCliente')?.value || '').trim();
  const email = (document.getElementById('emailCliente')?.value || '').trim();
  const telefono = (document.getElementById('telefonoCliente')?.value || '').trim();
  return !!nombre && emailValido(email) && telefonoValido(telefono);
}
function paso2Completo() {
  const municipio = document.getElementById('municipioEnvio')?.value || '';
  const direccion = (document.getElementById('direccionCliente')?.value || '').trim();
  return !!municipio && direccion.length >= 5;
}

/** Pinta un input en rojo y muestra su mensaje de error debajo.
    idInput = id del <input>/<select>, idError = id del div de mensaje. */
function marcarErrorCampo(idInput, idError, mensaje) {
  const input = document.getElementById(idInput);
  const err = document.getElementById(idError);
  if (input) input.classList.add('campo-error');
  if (err) { err.textContent = mensaje; err.classList.add('mostrar'); }
}
function limpiarErrorCampo(idInput, idError) {
  const input = document.getElementById(idInput);
  const err = document.getElementById(idError);
  if (input) input.classList.remove('campo-error');
  if (err) { err.textContent = ''; err.classList.remove('mostrar'); }
}
function limpiarTodosLosErrores() {
  ['nombreCliente','emailCliente','telefonoCliente','direccionCliente'].forEach(id => {
    limpiarErrorCampo(id, 'err' + id.charAt(0).toUpperCase() + id.slice(1));
  });
  limpiarErrorCampo('municipioEnvio', 'errMunicipioEnvio');
}

/** Revisa nombre/correo/teléfono. Devuelve true si todo está bien;
    si algo falla, marca el campo en rojo y devuelve false. */
function validarPaso1() {
  let ok = true;
  const nombre = document.getElementById('nombreCliente').value.trim();
  const email = document.getElementById('emailCliente').value.trim();
  const telefono = document.getElementById('telefonoCliente').value.trim();

  if (!nombre) { marcarErrorCampo('nombreCliente','errNombreCliente','Escribe tu nombre completo.'); ok = false; }
  else limpiarErrorCampo('nombreCliente','errNombreCliente');

  if (!email) { marcarErrorCampo('emailCliente','errEmailCliente','Escribe tu correo electrónico.'); ok = false; }
  else if (!emailValido(email)) { marcarErrorCampo('emailCliente','errEmailCliente','Ese correo no se ve válido — revisa que tenga "@" y un dominio (ej: nombre@correo.com).'); ok = false; }
  else limpiarErrorCampo('emailCliente','errEmailCliente');

  if (!telefono) { marcarErrorCampo('telefonoCliente','errTelefonoCliente','Escribe tu teléfono o WhatsApp.'); ok = false; }
  else if (!telefonoValido(telefono)) { marcarErrorCampo('telefonoCliente','errTelefonoCliente','Ese número no se ve válido — debe tener entre 7 y 10 dígitos.'); ok = false; }
  else limpiarErrorCampo('telefonoCliente','errTelefonoCliente');

  if (!ok) showToastCarrito('Revisa los datos marcados en rojo.');
  return ok;
}

/** Revisa municipio y dirección. Misma idea que validarPaso1. */
function validarPaso2() {
  let ok = true;
  const sel = document.getElementById('municipioEnvio');
  const direccion = document.getElementById('direccionCliente').value.trim();

  if (!sel.value) { marcarErrorCampo('municipioEnvio','errMunicipioEnvio','Elige el municipio o zona a donde enviamos tu pedido.'); ok = false; }
  else limpiarErrorCampo('municipioEnvio','errMunicipioEnvio');

  if (!direccion) { marcarErrorCampo('direccionCliente','errDireccionCliente','Escribe la dirección de entrega.'); ok = false; }
  else if (direccion.length < 5) { marcarErrorCampo('direccionCliente','errDireccionCliente','Esa dirección se ve incompleta — agrega calle/carrera y número.'); ok = false; }
  else limpiarErrorCampo('direccionCliente','errDireccionCliente');

  if (!ok) showToastCarrito('Revisa los datos marcados en rojo.');
  return ok;
}

/* ---------- aviso de sin conexión a internet ---------- */
function actualizarAvisoOffline() {
  const aviso = document.getElementById('avisoOffline');
  if (!aviso) return;
  aviso.classList.toggle('mostrar', !navigator.onLine);
}
window.addEventListener('online', actualizarAvisoOffline);
window.addEventListener('offline', actualizarAvisoOffline);

function showToastCarrito(texto) {
  const toast = document.getElementById('toast');
  if (!toast) { alert(texto); return; }
  document.getElementById('toastText').textContent = texto;
  toast.classList.add('error', 'show');
  clearTimeout(window._toastTimerCarrito);
  window._toastTimerCarrito = setTimeout(() => toast.classList.remove('show', 'error'), 2600);
}

/* ============================================================
   VALIDACIÓN CONTRA EL CATÁLOGO (Firestore) + EXTRAS DEL CARRITO
   ============================================================ */
/** Vuelve a leer el catálogo de Firestore y corrige precios / stock del carrito. */
let _revalidando = null;
function revalidar() {
  if (_revalidando) return _revalidando;
  _revalidando = (async () => {
    try {
      await cargarCatalogo();
      CarritoCore.reconciliar(typeof catalogoDesdeNube === 'function' && catalogoDesdeNube());
    } catch (e) {
      CarritoCore.reconciliar(false);
    } finally {
      _revalidando = null;
    }
    if (window.__carrito) window.__carrito.refrescar();
    actualizarContadoresGlobal();
  })();
  return _revalidando;
}
/* primera validación: en cuanto llega el catálogo */
catalogoListo.then(() => {
  CarritoCore.reconciliar(typeof catalogoDesdeNube === 'function' && catalogoDesdeNube());
  if (window.__carrito) window.__carrito.refrescar();
  const chips = document.getElementById('cartEmptyChips');     // estado vacío: ya se pueden mostrar categorías
  if (chips) chips.innerHTML = htmlChipsCategorias();
});
/* al volver a la pestaña después de un rato, se revisa de nuevo (alguien pudo comprar lo último) */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && CarritoCore.estado.validacion !== 'pendiente' && Date.now() - CarritoCore.estado.fecha > 60000) revalidar();
});

function actualizarContadoresGlobal() {
  const hdr = document.getElementById('cartCount');
  if (hdr) hdr.textContent = totalCarritoCount();
}

/* ---------- el carrito se conserva: se sincroniza con otras pestañas y con "atrás" ---------- */
window.addEventListener('storage', (e) => {
  if (e.key !== LS_KEYS.carrito) return;
  if (document.getElementById('cartList') && getCarrito().length) window.__carrito.refrescar();
  else if (!document.getElementById('estado-exito')?.offsetParent) pintarCarrito();
  actualizarContadoresGlobal();
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted && document.getElementById('cartList')) { window.__carrito.refrescar(); actualizarContadoresGlobal(); }
});

/* ---------- mensaje inferior con "Deshacer" ---------- */
function mostrarSnack(texto, accion, alAccionar) {
  let el = document.getElementById('cartSnack');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cartSnack'; el.className = 'cart-snack';
    el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.innerHTML = `<span></span><button type="button"></button>`;
  el.firstChild.textContent = texto;
  const b = el.querySelector('button');
  b.textContent = accion || '';
  b.hidden = !accion;
  b.onclick = () => { el.classList.remove('show'); if (alAccionar) alAccionar(); };
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 6000);
}

/* ---------- barra fija en celular: total + botón, mientras el resumen no se ve ---------- */
let _barra = null, _barraObs = null, _barraEstado = { oculta: false, resumenVisible: false, enCampo: false };
function actualizarBarraMovil(a, total, motivo) {
  if (!_barra) {
    _barra = document.createElement('div');
    _barra.className = 'cart-mobilebar'; _barra.id = 'cartMobileBar'; _barra.hidden = true;
    _barra.innerHTML = `<div class="mb-total"><small>Total</small><b id="mbTotal">$0</b></div><button type="button" class="mb-btn" id="mbBtn">${svgCandado()}<span>Finalizar compra</span><i class="btn-spinner" aria-hidden="true"></i></button>`;
    document.body.appendChild(_barra);
    _barra.querySelector('#mbBtn').addEventListener('click', () => { const b = document.getElementById('btnFinalizar'); if (b) b.click(); });
    // si el teclado está abierto (escribiendo en el formulario), la barra estorba
    document.addEventListener('focusin', (e) => { _barraEstado.enCampo = !!e.target.closest('input, textarea, select'); pintarEstadoBarra(); });
    document.addEventListener('focusout', () => { _barraEstado.enCampo = false; pintarEstadoBarra(); });
  }
  if (!a) { _barraEstado.vacia = true; pintarEstadoBarra(); return; }
  _barraEstado.vacia = false;
  const mt = _barra.querySelector('#mbTotal');
  if (mt) mt.textContent = fmtDinero(total);
  _barra.classList.toggle('is-blocked', !!motivo && motivo !== 'cargando');
  _barra.classList.toggle('is-loading', motivo === 'cargando');
  // observar el bloque de acciones del resumen: si ya se ve, la barra sobra
  const acciones = document.getElementById('resumenAcciones');
  if (acciones && 'IntersectionObserver' in window && _barraObs && _barraObs._el !== acciones) { _barraObs.disconnect(); _barraObs = null; }
  if (acciones && 'IntersectionObserver' in window && !_barraObs) {
    _barraObs = new IntersectionObserver((en) => { _barraEstado.resumenVisible = en[0].isIntersecting; pintarEstadoBarra(); }, { threshold: 0.2 });
    _barraObs._el = acciones; _barraObs.observe(acciones);
  }
  pintarEstadoBarra();
}
function pintarEstadoBarra() {
  if (!_barra) return;
  const oculta = _barraEstado.vacia || _barraEstado.resumenVisible || _barraEstado.enCampo;
  _barra.hidden = !!_barraEstado.vacia;
  _barra.classList.toggle('is-hidden', !!oculta);
  document.body.classList.toggle('has-mobilebar', !_barraEstado.vacia);
}

pintarCarrito();
_primeraPintura = false;

/* ---- animación de "pago" (igual que en el proyecto original) ---- */
function mostrarOverlay(metodoPago) {
  const overlay = document.getElementById('pago-overlay');
  overlay.classList.add('activo');
  iniciarParticulas();
  const msgs = ['Registrando tu pedido ⚡','Verificando tus datos','Casi, casi...','Sellando el pedido'];
  document.getElementById('pago-status-txt').textContent = msgs[0];
  document.querySelector('.ring-icon').textContent = '📦';
  let mi = 0;
  const st = document.getElementById('pago-status-txt');
  overlay._iv = setInterval(() => { st.textContent = msgs[++mi % msgs.length]; }, 700);
}

function cerrarOverlay() {
  const overlay = document.getElementById('pago-overlay');
  clearInterval(overlay._iv);
  overlay.classList.remove('activo');
  document.getElementById('estado-verificando').style.cssText = 'display:flex;opacity:1;';
  document.getElementById('estado-exito').style.display = 'none';
  document.getElementById('estado-error').style.display = 'none';
}

function mostrarExito(nombreCliente, pedidoId, items, metodoPago, resumen) {
  clearInterval(document.getElementById('pago-overlay')._iv);
  const ver = document.getElementById('estado-verificando');
  ver.style.transition = 'opacity 0.4s'; ver.style.opacity = '0';
  setTimeout(() => {
    ver.style.display = 'none';
    const ex = document.getElementById('estado-exito');
    ex.style.display = 'flex';
    const esContraentrega = metodoPago === 'contraentrega';
    document.querySelector('.check-circle').textContent = esContraentrega ? '📦' : '✅';
    const esNequi = metodoPago === 'nequi';
    document.querySelector('.exito-titulo').textContent = esContraentrega ? '¡Pedido confirmado! 📦' : (esNequi ? '¡Pedido recibido! ⚡' : '¡Pago exitoso! ⚡');
    document.querySelector('.exito-sub').textContent = esContraentrega
      ? 'Ya estamos organizando tu pedido — pagas cuando te llegue 🚀'
      : (esNequi
        ? 'Vamos a verificar tu transferencia por Nequi y te confirmamos el pedido por correo.'
        : 'Tu pago se realizó correctamente — ya casi vuela para tu casa 🚀');
    document.getElementById('gracias-nombre').textContent = '✨ ¡Muchas gracias, ' + nombreCliente + '! ✨';
    document.getElementById('exito-pedido').textContent = pedidoId ? `PEDIDO #${pedidoId}` : 'PEDIDO REGISTRADO';
    document.getElementById('exito-correo').textContent = 'Te mandamos la confirmación con el detalle y las fotos a tu correo ✉️';
    // Muestra qué se compró (con foto) para que quede clarísimo que
    // el pago sí se aplicó al pedido correcto.
    const wrapItems = document.getElementById('exito-items');
    if (wrapItems) {
      wrapItems.innerHTML = (items || []).map(it => `
        <div class="exito-item">
          ${it.foto ? `<img src="${it.foto}" alt="${it.nombre}" loading="lazy">` : ''}
          <div class="exito-item-info">
            <div class="exito-item-nombre">${it.nombre}</div>
            <div class="exito-item-meta">Talla ${it.talla || '—'} · $${Number(it.precio || 0).toLocaleString('es-CO')}</div>
          </div>
        </div>`).join('');
    }
    // Subtotal, envío y total del pedido
    const cajaTotales = document.getElementById('exito-totales');
    if (cajaTotales) {
      cajaTotales.innerHTML = resumen ? `
        <div class="exito-totales-fila"><span>Subtotal</span><span>${fmtDinero(resumen.subtotal)}</span></div>
        <div class="exito-totales-fila"><span>Envío</span><span>${resumen.envio ? fmtDinero(resumen.envio) : 'Gratis'}</span></div>
        <div class="exito-totales-total"><span>${esContraentrega ? 'Total a pagar al recibir' : 'Total'}</span><span>${fmtDinero(resumen.total)}</span></div>` : '';
    }
    document.querySelectorAll('.stepper-step').forEach(s => { s.classList.add('is-done'); s.classList.remove('is-active'); s.querySelector('.stepper-circle').textContent = '✓'; });
    document.querySelectorAll('.stepper-line').forEach(l => l.classList.add('is-done'));
    lanzarConfeti();
    pintarCarrito();
  }, 400);
}

function mostrarError(msg) {
  clearInterval(document.getElementById('pago-overlay')._iv);
  const ver = document.getElementById('estado-verificando');
  ver.style.transition = 'opacity 0.4s'; ver.style.opacity = '0';
  setTimeout(() => {
    ver.style.display = 'none';
    document.getElementById('estado-error').style.display = 'flex';
    document.getElementById('error-msg-txt').textContent = msg;
  }, 400);
}

function iniciarParticulas() {
  const canvas = document.getElementById('pago-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const pts = Array.from({length:40}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: Math.random()*1.4+0.3, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
    a: Math.random()*0.4+0.1
  }));
  (function frame() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,214,0,${p.a})`; ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>canvas.width) p.vx*=-1;
      if (p.y<0||p.y>canvas.height) p.vy*=-1;
    });
    if (document.getElementById('pago-overlay').classList.contains('activo')) requestAnimationFrame(frame);
  })();
}

function lanzarConfeti() {
  const colores = ['#FFD600','#F4F4F4','#0D0D0D','#ffe95c','#6B7280','#FFD600'];
  const card = document.querySelector('.pago-card');
  for (let i=0; i<50; i++) setTimeout(() => {
    const d = document.createElement('div');
    d.className = 'confeti-dot';
    d.style.cssText = `left:${Math.random()*100}%;top:${5+Math.random()*25}%;background:${colores[Math.floor(Math.random()*colores.length)]};animation-delay:${Math.random()*0.6}s;width:${5+Math.random()*9}px;height:${5+Math.random()*9}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    card.appendChild(d);
    setTimeout(() => d.remove(), 2400);
  }, i*35);
}
</script>
