/* ---------- helpers ---------- */
function fmtDinero(n) {
  return '$' + Number(n || 0).toLocaleString('es-CO');
}
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function animarClase(el, clase) {
  if (!el) return;
  el.classList.remove(clase);
  void el.offsetWidth;            // reinicia la animación
  el.classList.add(clase);
}
const reducirMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Muestra un valor en pesos y, si cambió, lo "cuenta" hasta el nuevo número. */
function setDinero(el, valor) {
  if (!el) return;
  const desde = typeof el._valor === 'number' ? el._valor : valor;
  el._valor = valor;
  cancelAnimationFrame(el._raf);
  if (desde === valor || reducirMovimiento) { el.textContent = fmtDinero(valor); return; }
  const t0 = performance.now(), dur = 380;
  (function paso(t) {
    const p = Math.min(1, (t - t0) / dur);
    const suave = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtDinero(Math.round(desde + (valor - desde) * suave));
    if (p < 1) el._raf = requestAnimationFrame(paso);
  })(t0);
  animarClase(el, 'tick');
}

];
function nombreColor(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return '';
  const rgb = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r, g, b] = rgb(m[1]);
  let mejor = '', dMin = Infinity;
  PALETA_COLORES.forEach(([nombre, h]) => {
    const [r2, g2, b2] = rgb(h.slice(1));
    const d = (r - r2) ** 2 + (g - g2) ** 2 + (b - b2) ** 2;
    if (d < dMin) { dMin = d; mejor = nombre; }
  });
  return mejor;
}

/* Agrupa items idénticos (mismo id + color + talla) en uno solo con cantidad */
function agruparCarrito(carrito) {
  const grupos = [];
  carrito.forEach(item => {
    const existente = grupos.find(g => g.id == item.id && g.color === item.color && g.talla === item.talla);
    if (existente) { existente.cantidad++; existente.subtotal += Number(item.precio); }
    else grupos.push({ ...item, cantidad: 1, subtotal: Number(item.precio) });
  });
  return grupos;
}

                    <button type="button" class="nequi-copiar" data-copiar="nequiValorTxt">Copiar</button>
                  </div>
                </div>
                <label class="nequi-check-fila">

                  <span>Ya hice la transferencia por este valor exacto</span>

                <p class="tarjeta-nota">Cuando confirmes el pedido, revisamos la transferencia y lo alistamos para enviar. Tu pedido queda pendiente hasta que confirmemos la transferencia.</p>
              </div>` : ''}

              <label class="ck-check ck-terminos">
                <input type="checkbox" id="aceptaTerminos" aria-describedby="errAceptaTerminos">
                <span>Acepto los <a href="legal.html#terminos" target="_blank" rel="noopener">términos y condiciones</a> y el <a href="legal.html#datos-personales" target="_blank" rel="noopener">tratamiento de mis datos personales</a>.</span>
              </label>
              <div class="campo-error-msg" id="errAceptaTerminos"></div>
            </div>

            <!-- ===== Navegación del paso ===== -->
            <div class="ck-actions">
              <button type="button" class="ck-btn ck-btn-ghost" id="ckAtras" hidden>${svgFlechaIz()}<span>Atrás</span></button>
              <button type="submit" class="ck-btn ck-btn-primary" id="ckSiguiente"><span id="ckSiguienteTxt">Continuar</span>${svgFlechaDe()}<i class="btn-spinner" aria-hidden="true"></i></button>
            </div>
          </form>
        </div>

      <aside class="carrito-summary-col" aria-label="Resumen del pedido">
        <div class="carrito-summary-card">
          <h2 class="summary-eyebrow">Resumen del pedido</h2>
          <div class="summary-row" id="listaFila" hidden><span>Precio de lista</span><span id="listaValor">${fmtDinero(analisisInicial.lista)}</span></div>
          <div class="summary-row is-discount" id="descFila" hidden><span>Descuentos</span><span id="descValor">−${fmtDinero(analisisInicial.descuentos)}</span></div>
          <div class="summary-row"><span>Subtotal</span><span id="subtotalValor">${fmtDinero(subtotalInicial)}</span></div>
          <div class="summary-row" id="envioFila"><span>Envío</span><span id="envioValor">Se calcula al elegir tu municipio</span></div>
          ${ENVIO_GRATIS_DESDE > 0 ? `
          <div class="ship-banner" id="shipBanner">
            <div class="ship-line">${svgCamion()}<span id="shipBannerTxt"></span></div>
            <div class="ship-progress"><i id="shipBar"></i></div>
          </div>` : ''}
          <div class="carrito-total">
            <span>Total</span>
            <span class="total-valor" id="totalValor">${fmtDinero(subtotalInicial)}</span>
          </div>
          <p class="cart-ahorro" id="ahorroTxt" hidden></p>
          <div class="resumen-acciones" id="resumenAcciones">
            <button type="button" class="btn-finalizar" id="btnFinalizar">${svgCandado()}<span id="btnFinalizarTxt">Continuar</span><i class="btn-spinner" aria-hidden="true"></i></button>
            <p class="cart-bloqueo" id="cartBloqueoMsg" role="status" hidden></p>
            <p class="finalizar-hint" id="finalizarHint"></p>
            <a href="productos.html" class="btn-seguir">${svgFlechaIz()}<span>Seguir comprando</span></a>
            ${PAGO_PAYPAL_ACTIVO ? `<button type="button" class="btn-paypal" id="btnPaypal"><span class="pp-mark" aria-hidden="true">P</span><span>Pagar con PayPal</span><span class="pp-soon">Pronto</span></button>` : ''}
          </div>
        </div>
        <div class="carrito-info-card">
          <div class="info-item">${svgBolsa()}<div><b>Cambios y devoluciones</b><span><a href="legal.html#cambios-devoluciones">Consulta las condiciones</a></span></div></div>
        </div>
      </aside>
    </div>`;

  wrap.innerHTML = html;

  /* ---------- resumen: subtotal / descuentos / envío / total (se actualiza solo) ---------- */
  const listEl = document.getElementById('cartList');
  const selectMunicipio = document.getElementById('municipioEnvio');
  const envioValorEl = document.getElementById('envioValor');
  const totalValorEl = document.getElementById('totalValor');
  let envioZona = 0;     // costo del envío según el municipio elegido
  let envioActual = 0;   // costo que de verdad se cobra (0 si aplica envío gratis)
  let pasoActual = 1, metodoPago = null, enviandoPedido = false;

  /** ¿Qué impide pagar ahora mismo? ('' = nada) */
  function motivoBloqueo(a) {
    if (a.estadoValidacion === 'pendiente') return 'cargando';
    if (a.verificado && a.problemas > 0) return 'problemas';
    if (a.unidadesValidas === 0) return 'vacio';
    if (a.unidades > MAX_UNIDADES_PEDIDO) return 'limite';
    return '';
  }

  function recalcularResumen() {
    const a = CarritoCore.analizar();
    const subtotal = a.subtotal;
    const gratis = ENVIO_GRATIS_DESDE > 0 && subtotal >= ENVIO_GRATIS_DESDE;
    envioActual = gratis ? 0 : envioZona;

    setDinero(document.getElementById('subtotalValor'), subtotal);
    const conDesc = a.descuentos > 0;
    const filaLista = document.getElementById('listaFila'), filaDesc = document.getElementById('descFila');
    if (filaLista) { filaLista.hidden = !conDesc; setDinero(document.getElementById('listaValor'), a.lista); }
    if (filaDesc) {
      filaDesc.hidden = !conDesc;
      const dv = document.getElementById('descValor');
      if (dv) dv.textContent = '−' + fmtDinero(a.descuentos);
    }
    const ahorro = document.getElementById('ahorroTxt');
    if (ahorro) { ahorro.hidden = !conDesc; if (conDesc) ahorro.textContent = `Estás ahorrando ${fmtDinero(a.descuentos)} en este pedido`; }

    const filaEnvio = document.getElementById('envioFila');
    if (filaEnvio) filaEnvio.classList.toggle('is-free', gratis);
    if (gratis) envioValorEl.textContent = '¡Gratis!';
    else envioValorEl.textContent = envioZona ? fmtDinero(envioZona) : 'Se calcula al elegir tu municipio';
    setDinero(totalValorEl, subtotal + envioActual);

    const banner = document.getElementById('shipBanner');
    if (banner) {
      const falta = Math.max(0, ENVIO_GRATIS_DESDE - subtotal);
      banner.classList.toggle('is-done', gratis);
      document.getElementById('shipBannerTxt').textContent = gratis
        ? '¡Envío gratis!'
        : `Te faltan ${fmtDinero(falta)} para el envío gratis`;
      document.getElementById('shipBar').style.width = Math.min(100, Math.round(subtotal / ENVIO_GRATIS_DESDE * 100)) + '%';
    }

    if (typeof renderRevision === 'function') { if (pasoActual === 3) renderRevision(); else pintarTotalesRevision(a); }

    // si ya eligió Nequi, el valor a transferir tiene que seguir al total
    const chipActivo = wrap.querySelector('.metodo-card.active');
    const nequiValor = document.getElementById('nequiValorTxt');
    if (chipActivo && chipActivo.dataset.metodo === 'nequi' && nequiValor) nequiValor.textContent = totalValorEl.textContent;

    // botón "Finalizar": bloqueado (sin deshabilitarlo) mientras haya algo por resolver
    const motivo = motivoBloqueo(a);
    const btn = document.getElementById('btnFinalizar'), msg = document.getElementById('cartBloqueoMsg');
    if (btn) {
      btn.classList.toggle('is-blocked', !!motivo && motivo !== 'cargando');
      btn.classList.toggle('is-loading', motivo === 'cargando');
      btn.setAttribute('aria-disabled', motivo ? 'true' : 'false');
    }
    if (msg) {
      msg.hidden = !motivo;
      msg.textContent = motivo === 'cargando' ? 'Verificando disponibilidad…'
        : motivo === 'problemas' ? 'Resuelve los avisos de tus productos para poder pagar.'
        : motivo === 'limite' ? `Un pedido admite hasta ${MAX_UNIDADES_PEDIDO} prendas. Quita algunas o divide tu compra en dos pedidos.`
        : motivo === 'vacio' ? 'No hay productos disponibles para comprar.' : '';
    }
    if (typeof actualizarBarraMovil === 'function') actualizarBarraMovil(a, subtotal + envioActual, motivo);
  }

  function actualizarContadores() {
    const n = totalCarritoCount();
    const hdr = document.getElementById('cartCount');
    if (hdr) { hdr.textContent = n; animarClase(hdr, 'bump'); }
    const c = document.getElementById('cartListCount');
    const w = document.getElementById('cartListWord');
    if (c) c.textContent = n;
    if (w) w.textContent = n === 1 ? 'producto' : 'productos';
  }

  /** Repinta lista, avisos y resumen SIN tocar el formulario (no se pierde lo escrito). */
  function refrescar() {
    const a = CarritoCore.analizar();
    if (!a.grupos.length) { pintarCarrito(); return; }
    if (!document.getElementById('cartList')) { pintarCarrito(); return; }
    listEl.classList.remove('is-first');
    listEl.innerHTML = a.grupos.map((g, n) => htmlFila(g, n)).join('');
    document.getElementById('cartNotices').innerHTML = htmlAvisos(a);
    recalcularResumen();
    actualizarContadores();
  }
  window.__carrito = { refrescar, recalcularResumen };

  /* ---------- filas: cambiar cantidad / quitar (sin repintar todo) ---------- */
  function quitarFilaAnimada(fila) {
    if (fila.dataset.saliendo) return;
    fila.dataset.saliendo = '1';
    fila.style.maxHeight = fila.offsetHeight + 'px';
    void fila.offsetWidth;
    fila.classList.add('is-leaving');
    setTimeout(() => {
      fila.remove();
      if (!listEl.querySelector('.cart-item')) pintarCarrito();   // ya no queda nada: estado vacío
    }, reducirMovimiento ? 0 : 340);
  }

  /** Rehace por dentro UNA fila con los datos actuales (conserva el foco del teclado). */
  function refrescarFila(fila) {
    const { id, color, talla } = fila.dataset;
    const a = CarritoCore.analizar();
    const g = a.grupos.find(x => x.id == id && x.color === color && x.talla === talla);
    if (!g) { quitarFilaAnimada(fila); return; }
    const activo = document.activeElement;
    const claseFoco = fila.contains(activo) ? ['qty-plus', 'qty-minus', 'btn-eliminar'].find(c => activo.classList.contains(c)) : null;
    const lineaPrev = fila.querySelector('.cart-item-line');
    const prev = lineaPrev && typeof lineaPrev._valor === 'number' ? lineaPrev._valor : null;
    fila.classList.toggle('is-unavailable', g.info.estado === 'no_disponible' || g.info.estado === 'agotado');
    fila.classList.toggle('is-warning', g.info.estado === 'parcial');
    fila.innerHTML = htmlFilaInterior(g);
    const linea = fila.querySelector('.cart-item-line');
    if (linea) { if (prev !== null) linea._valor = prev; setDinero(linea, g.subtotal); }
    animarClase(fila.querySelector('.qty-value'), 'bump');
    animarClase(fila, 'flash');
    if (claseFoco) (fila.querySelector('.' + claseFoco) || fila.querySelector('.qty-minus'))?.focus({ preventScroll: true });
  }

  function despuesDeCambio(fila) {
    refrescarFila(fila);
    document.getElementById('cartNotices').innerHTML = htmlAvisos(CarritoCore.analizar());
    recalcularResumen();
    actualizarContadores();
  }

  function deshacerA(instantanea) {
    return () => {
      _guardar(LS_KEYS.carrito, instantanea);
      if (document.getElementById('cartList')) window.__carrito.refrescar(); else pintarCarrito();
      actualizarContadoresGlobal();
    };
  }

  listEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.qty-plus, .qty-minus, .btn-eliminar, [data-act]');
    if (!btn) return;
    e.preventDefault();
    const fila = btn.closest('.cart-item');
    if (!fila || fila.dataset.saliendo) return;
    const { id, color, talla } = fila.dataset;
    const antes = CarritoCore.leer();
    const cantidadAntes = antes.filter(it => it.id == id && it.color === color && it.talla === talla).length;
    const nombreProd = (antes.find(it => it.id == id) || {}).nombre || 'producto';

    if (btn.dataset.act === 'ajustar') {
      CarritoCore.ajustarAlStock(id, color, talla, Number(btn.dataset.n) || 0);
      despuesDeCambio(fila);
      return;
    }
    if (btn.dataset.act === 'quitar' || btn.classList.contains('btn-eliminar') || (btn.classList.contains('qty-minus') && cantidadAntes <= 1)) {
      eliminarGrupo(id, color, talla);
      despuesDeCambio(fila);
      mostrarSnack(`Quitaste «${nombreProd}»`, 'Deshacer', deshacerA(antes));
      return;
    }
    if (btn.classList.contains('qty-plus')) {
      if (btn.classList.contains('is-loading')) return;
      if (CarritoCore.estado.validacion === 'pendiente') {       // necesitamos el catálogo para revisar el stock
        btn.classList.add('is-loading');
        await catalogoListo;
        btn.classList.remove('is-loading');
      }
      const producto = buscarProducto(id);
      if (!producto) { showToastCarrito('No pudimos revisar el stock de este producto ahora mismo. Intenta de nuevo.'); return; }
      if (!CarritoCore.vendible(producto)) { showToastCarrito(`${producto.nombre} ya no está disponible.`); refrescar(); return; }
      const mas = CarritoCore.cuantasMasSePuede(producto, color, talla, CarritoCore.leer());
      if (mas <= 0) {
        const tope = CarritoCore.topeVariante(producto, color, talla);
        showToastCarrito(tope <= 0 ? `${producto.nombre} está agotado en esa combinación.` : `Ya tienes todas las unidades disponibles (${tope}) de ${producto.nombre} en ese color y talla.`);
        animarClase(fila, 'shake');
        return;
      }
      agregarAlCarrito(producto, color, talla);
    } else if (btn.classList.contains('qty-minus')) {
      quitarUnidad(id, color, talla);
    }
    despuesDeCambio(fila);
  });

  /* ---------- avisos sobre la lista ---------- */
  document.getElementById('cartNotices').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-notice]');
    if (!b) return;
    const acc = b.dataset.notice;
    if (acc === 'cerrar') { CarritoCore.estado.avisosPrecio.splice(Number(b.dataset.k), 1); refrescar(); }
    else if (acc === 'reintentar') { b.classList.add('is-busy'); await revalidar(); }
    else if (acc === 'quitar-malos') {
      const antes = CarritoCore.leer();
      CarritoCore.quitarNoDisponibles();
      refrescar();
      actualizarContadoresGlobal();
      mostrarSnack('Quitamos los productos no disponibles', 'Deshacer', deshacerA(antes));
    }
  });

  const btnLimpiar = document.getElementById('btnLimpiar');
  if (btnLimpiar) {
    btnLimpiar.addEventListener('click', (e) => {
      e.preventDefault();
      const antes = CarritoCore.leer();
      limpiarCarrito();
      listEl.querySelectorAll('.cart-item').forEach((fila, i) => setTimeout(() => quitarFilaAnimada(fila), reducirMovimiento ? 0 : i * 70));
      recalcularResumen();
      actualizarContadores();
      mostrarSnack('Vaciaste el carrito', 'Deshacer', deshacerA(antes));
    });
  }

  /* =====================================================================
     CHECKOUT POR PASOS: 1 Tus datos → 2 Entrega → 3 Resumen y pago → 4 Confirmación
     · Cada paso es un panel del MISMO formulario: al retroceder, los campos
       siguen ahí (no se borra nada). Además se guarda un borrador en
       sessionStorage por si la página se recarga.
     · Una sola puerta de entrada (accionPrincipal) y un solo candado
       (enviandoPedido): no hay clics ni pedidos duplicados.
     ===================================================================== */
  const $ = (id) => document.getElementById(id);
  const formPago = $('form-pago');
  const paneles = [...wrap.querySelectorAll('.ck-panel')];
  const PASOS = {
    1: { eyebrow: 'Paso 1 de 3', titulo: 'Tus datos', sub: 'Los usamos solo para confirmar y entregar tu pedido.', cta: 'Continuar a entrega' },
    2: { eyebrow: 'Paso 2 de 3', titulo: 'Dirección y entrega', sub: 'Dinos dónde recibirás tu pedido.', cta: 'Revisar mi pedido' },
    3: { eyebrow: 'Paso 3 de 3', titulo: 'Resumen y pago', sub: 'Revisa todo y elige cómo pagar.', cta: 'Confirmar pedido' },
  };
  const textoAccion = (n) => (n === 3 ? 'Confirmar pedido' : 'Continuar');

  /* ---- avisos cuando algo impide seguir ---- */
  function avisarBloqueo(motivo) {
    if (motivo === 'cargando') showToastCarrito('Estamos verificando la disponibilidad. Un momento…');
    else if (motivo === 'problemas') { showToastCarrito('Resuelve los avisos de tu carrito antes de pagar.'); $('cartNotices').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'center' }); }
    else if (motivo === 'limite') showToastCarrito(`Un pedido admite hasta ${MAX_UNIDADES_PEDIDO} prendas. Quita algunas o divide tu compra en dos pedidos.`);
    else showToastCarrito('Tu carrito no tiene productos disponibles para comprar.');
  }
  function mostrarAlerta(texto) {
    const el = $('ckAlert');
    if (!el) return;
    el.textContent = texto || '';
    el.hidden = !texto;
  }

  /* ---- stepper de arriba (clic en un paso ya hecho = volver ahí) ---- */
  const stepperSteps = wrap.querySelectorAll('.stepper-step');
  const stepperLines = wrap.querySelectorAll('.stepper-line');
  function activarStepper(n) {
    stepperSteps.forEach(s => {
      const num = Number(s.dataset.stepper);
      const circle = s.querySelector('.stepper-circle');
      s.classList.remove('is-active', 'is-done');
      s.removeAttribute('aria-current');
      const hecho = num < n;
      if (hecho) { s.classList.add('is-done'); circle.textContent = '✓'; }
      else { circle.textContent = num; if (num === n) { s.classList.add('is-active'); s.setAttribute('aria-current', 'step'); } }
      s.toggleAttribute('data-volver', hecho && num <= 3);
      s.setAttribute('tabindex', hecho && num <= 3 ? '0' : '-1');
      s.setAttribute('role', hecho && num <= 3 ? 'button' : 'presentation');
    });
    stepperLines.forEach(l => l.classList.toggle('is-done', Number(l.dataset.line) < n));
  }
  stepperSteps.forEach(s => {
    const ir = () => { const num = Number(s.dataset.stepper); if (s.hasAttribute('data-volver') && !enviandoPedido && num < pasoActual) irAPaso(num); };
    s.addEventListener('click', ir);
    s.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ir(); } });
  });

  /* ---- navegación entre pasos ---- */
  function irAPaso(n, opciones) {
    const op = opciones || {};
    pasoActual = n;
    paneles.forEach(p => {
      const activo = Number(p.dataset.step) === n;
      p.hidden = !activo;
      p.classList.toggle('is-active', activo);
    });
    const info = PASOS[n];
    $('ckEyebrow').textContent = info.eyebrow;
    $('ckTitulo').textContent = info.titulo;
    $('ckSub').textContent = info.sub;
    $('ckAtras').hidden = n === 1;
    $('ckSiguienteTxt').textContent = info.cta;
    const bf = $('btnFinalizarTxt'); if (bf) bf.textContent = textoAccion(n);
    const mb = document.querySelector('#mbBtn span'); if (mb) mb.textContent = textoAccion(n);
    activarStepper(n);
    const acciones = $('resumenAcciones');
    if (acciones) acciones.classList.toggle('visible', n === 3);
    mostrarAlerta('');
    if (n === 3) renderRevision();
    guardarBorrador();
    // el botón "Atrás" del navegador también retrocede de paso
    if (!op.desdeHistorial) {
      try { history[op.reemplazar ? 'replaceState' : 'pushState']({ ckPaso: n }, '', location.href); } catch (e) { /* sin historial */ }
    }
    if (op.desplazar !== false) $('ckBox').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'start' });
    if (op.enfocar !== false) {
      setTimeout(() => {
        const panel = paneles.find(p => Number(p.dataset.step) === n);
        const primero = n === 3 ? $('ckTitulo') : panel.querySelector('input:not([type=checkbox]):not([type=hidden]), select:not([style*="display: none"])');
        if (primero) primero.focus({ preventScroll: true });
      }, 80);
    }
  }
  if (window.__ckPop) window.removeEventListener('popstate', window.__ckPop);
  window.__ckPop = (e) => {
    if (enviandoPedido || pedidoConfirmado || !$('ckBox')) return;
    const n = (e.state && e.state.ckPaso) || 1;
    if (n !== pasoActual) irAPaso(Math.min(n, pasoActual), { desdeHistorial: true, enfocar: false });
  };
  window.addEventListener('popstate', window.__ckPop);

  $('ckAtras').addEventListener('click', () => { if (!enviandoPedido && pasoActual > 1) irAPaso(pasoActual - 1); });
  wrap.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { if (!enviandoPedido) irAPaso(Number(b.dataset.goto)); }));
  const editarCarrito = $('ckEditarCarrito');
  if (editarCarrito) editarCarrito.addEventListener('click', (e) => { e.preventDefault(); $('cartList').scrollIntoView({ behavior: reducirMovimiento ? 'auto' : 'smooth', block: 'start' }); });

  /* ---- punto único de entrada: botón del formulario, botón del resumen y barra del celular ---- */
  async function accionPrincipal() {
    if (enviandoPedido || pedidoConfirmado) return;
    if (pasoActual === 1) { if (validarPaso1()) irAPaso(2); return; }
    if (pasoActual === 2) { if (validarPaso2()) irAPaso(3); return; }
    await confirmarPedido();
  }
  formPago.addEventListener('submit', (e) => { e.preventDefault(); accionPrincipal(); });
  const btnFinalizar = $('btnFinalizar');
  if (btnFinalizar) btnFinalizar.addEventListener('click', (e) => { e.preventDefault(); accionPrincipal(); });

  /* ---- campos: errores se limpian al corregir, teléfono con formato, correo con sugerencia ---- */
  wrap.querySelectorAll('.ck-panel input, .ck-panel select, .ck-panel textarea').forEach(el => {
    el.addEventListener('input', () => { if (!wrap.querySelector('.ck-panel.is-active .campo-error:not(#' + el.id + ')')) mostrarAlerta(''); if (el.classList.contains('campo-error')) { el.classList.remove('campo-error'); el.removeAttribute('aria-invalid'); const err = $('err' + el.id.charAt(0).toUpperCase() + el.id.slice(1)); if (err) { err.textContent = ''; err.classList.remove('mostrar'); } } });
    if (el.tagName === 'INPUT' && el.type !== 'checkbox') {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id !== 'municipioInput') { e.preventDefault(); accionPrincipal(); } });
    }
  });
  const inTel = $('telefonoCliente');
  inTel.addEventListener('input', () => {
    let d = inTel.value.replace(/\D/g, '');
    if (d.length > 10 && d.startsWith('57')) d = d.slice(2);
    d = d.slice(0, 10);
    const f = d.replace(/^(\d{3})(\d{1,3})?(\d{1,4})?$/, (m, a, b, c) => [a, b, c].filter(Boolean).join(' '));
    if (inTel.value !== f) inTel.value = f;
  });
  const DOMINIOS_TYPO = { 'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com', 'gamil.com': 'gmail.com', 'gmail.con': 'gmail.com', 'gmail.co': 'gmail.com', 'hotmial.com': 'hotmail.com', 'hotmal.com': 'hotmail.com', 'hotmail.con': 'hotmail.com', 'outlok.com': 'outlook.com', 'outlook.con': 'outlook.com', 'yahooo.com': 'yahoo.com', 'yaho.com': 'yahoo.com' };
  const inEmail = $('emailCliente'), sugEmail = $('ckEmailSug');

/* ---------- validación real de campos del checkout ---------- */

/** Correo con forma válida: algo@algo.algo (sin espacios). */
function emailValido(valor) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor) && valor.length <= 120;
}
/** Teléfono colombiano razonable: 7 a 10 dígitos, dejando de lado
    espacios, guiones y el +57 si lo escriben. */
function telefonoValido(valor) {
  return !!normalizarTelefonoCO(valor);
}
/** Nombre real: al menos nombre y apellido, solo letras, espacios, punto, apóstrofe o guion. */
function nombreValido(valor) {
  const v = valor.trim().replace(/\s+/g, ' ');
  return v.length >= 3 && v.split(' ').length >= 2 && /^[\p{L}][\p{L}\s.'’-]*$/u.test(v);
}

/** Igual que validarPaso1/2, pero sin pintar nada en rojo — solo dicen si el
    paso ya quedó completo (se usa para restaurar el borrador). */
function paso1Completo() {
  const val = (id) => (document.getElementById(id)?.value || '').trim();
  return nombreValido(val('nombreCliente')) && emailValido(val('emailCliente')) && telefonoValido(val('telefonoCliente'));
}
function paso2Completo() {
  const val = (id) => (document.getElementById(id)?.value || '').trim();
  const zona = document.getElementById('municipioEnvio')?.value || '';
  const rural = zona === 'vereda' && document.getElementById('departamentoEnvio')?.value === 'Antioquia';
  return !!zona && val('direccionCliente').length >= 5 && (!rural || val('veredaCliente').length >= 2);
}

/** Pinta un input en rojo y muestra su mensaje de error debajo.
    idInput = id del <input>/<select>, idError = id del div de mensaje. */
function marcarErrorCampo(idInput, idError, mensaje) {
  const input = document.getElementById(idInput);
  const err = document.getElementById(idError);
  if (input) { input.classList.add('campo-error'); input.setAttribute('aria-invalid', 'true'); }
  if (err) { err.textContent = mensaje; err.classList.add('mostrar'); }
}
function limpiarErrorCampo(idInput, idError) {
  const input = document.getElementById(idInput);
  const err = document.getElementById(idError);
  if (input) { input.classList.remove('campo-error'); input.removeAttribute('aria-invalid'); }
  if (err) { err.textContent = ''; err.classList.remove('mostrar'); }
}
function _alertaPaso(texto) {
  const el = document.getElementById('ckAlert');
  if (el) { el.textContent = texto || ''; el.hidden = !texto; }
}
function _enfocarPrimerError(ids) {
  const el = ids.map(id => document.getElementById(id)).find(e => e && e.classList.contains('campo-error'));
  if (el) { el.scrollIntoView({ block: 'center', behavior: reducirMovimiento ? 'auto' : 'smooth' }); el.focus({ preventScroll: true }); }
}

/** Revisa nombre/correo/teléfono. Devuelve true si todo está bien;
    si algo falla, marca el campo en rojo, lleva el foco ahí y devuelve false. */
function validarPaso1() {
  let ok = true;
  const nombre = document.getElementById('nombreCliente').value.trim();
  const email = document.getElementById('emailCliente').value.trim();
  const telefono = document.getElementById('telefonoCliente').value.trim();

  if (!nombre) { marcarErrorCampo('nombreCliente', 'errNombreCliente', 'Escribe tu nombre completo.'); ok = false; }
  else if (!nombreValido(nombre)) { marcarErrorCampo('nombreCliente', 'errNombreCliente', 'Escribe tu nombre y apellido, solo con letras (ej: María Gómez).'); ok = false; }
  else limpiarErrorCampo('nombreCliente', 'errNombreCliente');

  if (!email) { marcarErrorCampo('emailCliente', 'errEmailCliente', 'Escribe tu correo electrónico.'); ok = false; }
  else if (!emailValido(email)) { marcarErrorCampo('emailCliente', 'errEmailCliente', 'Ese correo no se ve válido: revisa que tenga "@" y un dominio (ej: nombre@correo.com).'); ok = false; }
  else limpiarErrorCampo('emailCliente', 'errEmailCliente');

  if (!telefono) { marcarErrorCampo('telefonoCliente', 'errTelefonoCliente', 'Escribe tu celular o WhatsApp.'); ok = false; }
  else if (!telefonoValido(telefono)) { marcarErrorCampo('telefonoCliente', 'errTelefonoCliente', 'Ese número no se ve válido: debe tener 10 dígitos (ej: 300 123 4567).'); ok = false; }
  else limpiarErrorCampo('telefonoCliente', 'errTelefonoCliente');

  _alertaPaso(ok ? '' : 'Revisa los campos marcados en rojo para continuar.');
  if (!ok) _enfocarPrimerError(['nombreCliente', 'emailCliente', 'telefonoCliente']);
  return ok;
}

/** Revisa departamento, ciudad y dirección. Misma idea que validarPaso1. */
function validarPaso2() {
  let ok = true;
  const sel = document.getElementById('municipioEnvio');
  const depto = document.getElementById('departamentoEnvio').value;
  const direccion = document.getElementById('direccionCliente').value.trim();
  const rural = sel.value === 'vereda' && depto === 'Antioquia';

  if (!depto) { marcarErrorCampo('departamentoEnvio', 'errDepartamentoEnvio', 'Elige tu departamento.'); ok = false; }
  else limpiarErrorCampo('departamentoEnvio', 'errDepartamentoEnvio');

  if (!sel.value) {
    marcarErrorCampo('municipioInput', 'errMunicipioEnvio', depto === 'Antioquia'
      ? 'Elige tu municipio de la lista: escribe las primeras letras y tócalo.'
      : 'Escribe tu ciudad o municipio (mínimo 3 letras).');
    ok = false;
  } else limpiarErrorCampo('municipioInput', 'errMunicipioEnvio');

  if (!direccion) { marcarErrorCampo('direccionCliente', 'errDireccionCliente', 'Escribe la dirección de entrega.'); ok = false; }
  else if (direccion.length < 5) { marcarErrorCampo('direccionCliente', 'errDireccionCliente', 'Esa dirección se ve incompleta: agrega calle o carrera y número (ej: Calle 45 # 30-12).'); ok = false; }
  else limpiarErrorCampo('direccionCliente', 'errDireccionCliente');

  if (rural && document.getElementById('veredaCliente').value.trim().length < 2) { marcarErrorCampo('veredaCliente', 'errVeredaCliente', 'Escribe el nombre de tu vereda.'); ok = false; }
  else limpiarErrorCampo('veredaCliente', 'errVeredaCliente');

  _alertaPaso(ok ? '' : 'Revisa los campos marcados en rojo para continuar.');
  if (!ok) _enfocarPrimerError(['departamentoEnvio', 'municipioInput', 'direccionCliente', 'veredaCliente']);
  return ok;
}

  clearTimeout(window._toastTimerCarrito);

}

document.addEventListener('keydown', (e) => {
